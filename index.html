      // ==========================================
      // 11. FOREGROUND FLOOR, WOODEN FENCE & +30% ENLARGED JADE BANGLE
      // ==========================================
      function drawFloorAndFence() {
        const floorTop = height * 0.725;
        ctx.save();

        // Dark weathered wooden floor planks
        const floorGrad = ctx.createLinearGradient(0, floorTop, 0, height);
        floorGrad.addColorStop(0, '#291106');
        floorGrad.addColorStop(0.45, '#3b190b');
        floorGrad.addColorStop(1, '#160803');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, floorTop, width, height - floorTop);

        ctx.strokeStyle = 'rgba(12, 4, 1, 0.6)';
        ctx.lineWidth = 1.6;
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(width * 0.5 + i * (width * 0.11), floorTop);
          ctx.lineTo(width * 0.5 + i * (width * 0.24), height);
          ctx.stroke();
        }

        // Foreground Wooden Fence Railing (圍欄，玩家站在圍欄外)
        const fenceY = height * 0.78;
        const postCount = 6;
        const postSpacing = width / (postCount - 1);

        for (let i = 0; i < postCount; i++) {
          const px = i * postSpacing;
          const pGrad = ctx.createLinearGradient(px - 8, 0, px + 8, 0);
          pGrad.addColorStop(0, '#2e1206');
          pGrad.addColorStop(0.5, '#6e3318');
          pGrad.addColorStop(1, '#210c04');
          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.roundRect(px - 8, fenceY - 12, 16, height - fenceY + 20, 4);
          ctx.fill();
        }

        const railGrad = ctx.createLinearGradient(0, fenceY - 7, 0, fenceY + 14);
        railGrad.addColorStop(0, '#8c4623');
        railGrad.addColorStop(0.45, '#5e2b14');
        railGrad.addColorStop(1, '#2b1005');
        ctx.fillStyle = railGrad;
        ctx.fillRect(0, fenceY - 7, width, 20);

        ctx.strokeStyle = 'rgba(255, 215, 145, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, fenceY - 6);
        ctx.lineTo(width, fenceY - 6);
        ctx.stroke();

        // Draw Player's Ready +30% Enlarged Jade Bangle on the railing when PLAYING
        if (gameState === 'PLAYING' && banglesLeft > 0) {
          const hand = getPlayerHandPos();

          // Aiming trajectory guide when dragging
          if (pointerDown && isDraggingAim) {
            const dx = pointerCurr.x - pointerStart.x;
            const dy = pointerCurr.y - pointerStart.y;
            if (dy < -15) {
              const aimX = Math.max(width * 0.08, Math.min(width * 0.92, hand.x + dx * 1.45));
              const aimY = Math.max(height * 0.18, Math.min(height * 0.71, hand.y + dy * 1.65));

              ctx.save();
              ctx.setLineDash([6, 6]);
              ctx.strokeStyle = 'rgba(110, 255, 198, 0.7)';
              ctx.lineWidth = 2.8;
              ctx.beginPath();
              ctx.moveTo(hand.x, hand.y);
              ctx.quadraticCurveTo((hand.x + aimX) * 0.5, Math.min(hand.y, aimY) - 65, aimX, aimY);
              ctx.stroke();

              ctx.setLineDash([]);
              ctx.strokeStyle = 'rgba(110, 255, 198, 0.9)';
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.ellipse(aimX, aimY, 24, 15, 0, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          // Reserve stack of remaining bangles (+30% enlarged) on bottom-left railing
          for (let b = 0; b < banglesLeft - 1; b++) {
            drawJadeBangleRing(width * 0.19 + b * 20, hand.y + 8 - b * 5, BANGLE_STACK_RX, BANGLE_STACK_RY, 0);
          }

          // Main active jade bangle in center (+30% enlarged: 47x29)
          const floatOffset = Math.sin(globalTime * 3.8) * 3.5;
          drawJadeBangleRing(hand.x, hand.y + floatOffset, BANGLE_BASE_RX, BANGLE_BASE_RY, 0);
        }

        ctx.restore();
      }

      function drawJadeBangleRing(x, y, rx, ry, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);

        const bandThick = Math.max(5.0, rx * 0.25);

        // 1. Deep 3D drop shadow
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.lineWidth = bandThick * 1.05;
        ctx.beginPath();
        ctx.ellipse(0, 4.5, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        // 2. Outer dark emerald edge for 3D cylindrical volume
        ctx.strokeStyle = '#064e3b';
        ctx.lineWidth = bandThick + 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        // 3. Translucent Imperial Emerald Jade Body (冰種翠玉質感)
        const jadeGrad = ctx.createLinearGradient(-rx, -ry, rx, ry);
        jadeGrad.addColorStop(0, '#a7f3d0');
        jadeGrad.addColorStop(0.28, '#34d399');
        jadeGrad.addColorStop(0.65, '#059669');
        jadeGrad.addColorStop(0.88, '#047857');
        jadeGrad.addColorStop(1, '#6ee7b7');

        ctx.strokeStyle = jadeGrad;
        ctx.lineWidth = bandThick;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        // 4. Glossy Jade Specular Rim Highlights
        ctx.strokeStyle = 'rgba(236, 253, 245, 0.88)';
        ctx.lineWidth = Math.max(1.8, rx * 0.065);
        ctx.beginPath();
        ctx.ellipse(0, -1.2, rx * 0.97, ry * 0.95, 0, Math.PI * 1.08, Math.PI * 1.88);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(167, 243, 208, 0.55)';
        ctx.lineWidth = Math.max(1.2, rx * 0.045);
        ctx.beginPath();
        ctx.ellipse(0, 1.2, rx * 0.95, ry * 0.93, 0, Math.PI * 0.12, Math.PI * 0.82);
        ctx.stroke();

        ctx.restore();
      }

      // ==========================================
      // 12. MAIN 60FPS ANIMATION LOOP
      // ==========================================
      let lastTime = performance.now();
      let fireworkSpawnAccum = 0;

      function update(dt) {
        globalTime += dt;

        // 1. Update ambient warm dust particles
        for (let i = 0; i < ambientDust.length; i++) {
          const d = ambientDust[i];
          d.x += d.vx * dt + Math.sin(globalTime * 1.5 + d.phase) * 0.15;
          d.y += d.vy * dt;
          if (d.y < height * 0.08) {
            d.y = height * 0.75;
            d.x = Math.random() * width;
          }
          if (d.x < 0) d.x = width;
          if (d.x > width) d.x = 0;
        }

        // 2. Move shelf items horizontally (緩慢左右交叉移動)
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          const row = shelfRows[it.rowIndex];
          if (!row) continue;

          it.x += row.speed * dt;
          const trackW = row.right - row.left;
          if (row.speed > 0 && it.x > row.right) {
            it.x -= trackW;
          } else if (row.speed < 0 && it.x < row.left) {
            it.x += trackW;
          }

          if (it.captured && it.captureAnim < 1) {
            it.captureAnim = Math.min(1, it.captureAnim + dt * 2.5);
          }
        }

        // 3. Update active thrown Jade Bangles
        for (let i = activeBangles.length - 1; i >= 0; i--) {
          const b = activeBangles[i];
          b.elapsed += dt;
          const t = Math.min(1, b.elapsed / b.duration);

          const easeT = 1 - Math.pow(1 - t, 1.65);
          b.x = b.startX + (b.targetX - b.startX) * easeT;
          const linearY = b.startY + (b.targetY - b.startY) * easeT;
          const arcLift = Math.sin(t * Math.PI) * b.arcHeight;
          b.y = linearY - arcLift;
          // Keep perspective scale larger so the +30% jade bangle looks substantial all the way to the shelf
          b.scale = 1.18 - 0.46 * easeT;
          b.rotation = t * Math.PI * 1.3;

          if (t >= 1) {
            activeBangles.splice(i, 1);
            evaluateBangleLanding(b);
          }
        }

        // 4. Update shattered curved jade shards with realistic shelf/floor bounce
        for (let i = jadeShards.length - 1; i >= 0; i--) {
          const sh = jadeShards[i];
          sh.x += sh.vx * dt;
          sh.y += sh.vy * dt;
          sh.vy += 380 * dt; // gravity
          sh.rot += sh.vRot * dt;

          if (!sh.bounced && sh.y >= sh.floorY && sh.vy > 0) {
            sh.y = sh.floorY;
            sh.vy = -sh.vy * 0.42;
            sh.vx *= 0.72;
            sh.vRot *= 0.6;
            sh.bounced = true;
          }

          sh.alpha -= dt * 1.25;
          if (sh.alpha <= 0) {
            jadeShards.splice(i, 1);
          }
        }

        // 5. Update hit glow rings & sparkles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          if (p.kind === 'ring') {
            p.r += (p.maxR - p.r) * dt * 7.5;
            p.alpha -= dt * 1.8;
          } else {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 180 * dt;
            p.alpha -= p.decay * dt;
          }
          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }

        // 6. Update floating feedback text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.alpha -= dt * 1.15;
          if (ft.alpha <= 0) {
            floatingTexts.splice(i, 1);
          }
        }

        // 7. Update fullscreen victory fireworks
        if (gameState === 'VICTORY') {
          fireworkSpawnAccum += dt;
          if (fireworkSpawnAccum >= 0.55) {
            fireworkSpawnAccum = 0;
            spawnFireworkBurst();
          }
        }
        for (let i = fireworks.length - 1; i >= 0; i--) {
          const fw = fireworks[i];
          fw.x += fw.vx * dt;
          fw.y += fw.vy * dt;
          fw.vy += 110 * dt;
          fw.vx *= 0.985;
          fw.alpha -= fw.decay * dt;
          if (fw.alpha <= 0) {
            fireworks.splice(i, 1);
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        // 1. Night Market Stall & Environment
        drawNightMarketScene();

        // 2. Shelf Items (Enlarged, detailed toys)
        for (let i = 0; i < items.length; i++) {
          drawToyItem(items[i]);
        }

        // 3. Foreground Floor, Fence & +30% Enlarged Ready Jade Bangle
        drawFloorAndFence();

        // 4. Flying +30% Enlarged Jade Bangles
        for (let i = 0; i < activeBangles.length; i++) {
          const b = activeBangles[i];
          drawJadeBangleRing(
            b.x,
            b.y,
            BANGLE_BASE_RX * 0.95 * b.scale,
            BANGLE_BASE_RY * 0.95 * b.scale,
            b.rotation * 0.14
          );
        }

        // 5. Realistic Curved Jade Fracture Shards (when missing a target)
        for (let i = 0; i < jadeShards.length; i++) {
          const sh = jadeShards[i];
          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.globalAlpha = Math.max(0, sh.alpha);

          // Curved broken jade arc segment
          ctx.strokeStyle = '#047857';
          ctx.lineWidth = sh.thick + 1.5;
          ctx.lineCap = 'butt';
          ctx.beginPath();
          ctx.arc(0, 0, sh.arcRadius, -sh.arcSpan * 0.5, sh.arcSpan * 0.5);
          ctx.stroke();

          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = sh.thick;
          ctx.beginPath();
          ctx.arc(0, 0, sh.arcRadius, -sh.arcSpan * 0.5, sh.arcSpan * 0.5);
          ctx.stroke();

          // Crystalline fracture highlight
          ctx.strokeStyle = '#ecfdf5';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(0, -0.8, sh.arcRadius, -sh.arcSpan * 0.4, sh.arcSpan * 0.4);
          ctx.stroke();

          ctx.restore();
        }

        // 6. Hit Glow Rings & Sparkles
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          if (p.kind === 'ring') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.r, p.r * 0.65, 0, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 7. Ambient Warm Night Market Dust
        for (let i = 0; i < ambientDust.length; i++) {
          const d = ambientDust[i];
          ctx.fillStyle = `rgba(255, 220, 140, ${d.alpha * 0.45})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 8. Floating Feedback Texts
        for (let i = 0; i < floatingTexts.length; i++) {
          const ft = floatingTexts[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = '900 17px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = 'rgba(20, 8, 3, 0.92)';
          ctx.lineWidth = 4.5;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        // 9. Victory Fullscreen Fireworks
        for (let i = 0; i < fireworks.length; i++) {
          const fw = fireworks[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, fw.alpha);
          ctx.fillStyle = fw.color;
          ctx.shadowColor = fw.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(fw.x, fw.y, fw.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function resizeCanvas() {
        const frame = document.getElementById('game-frame');
        const rect = frame.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = Math.max(540, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        initAtmosphereParticles();
        setupLevel(currentLevelIndex);
        render();
      }

      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        resizeCanvas();
        showHomeScreen();
        lastTime = performance.now();
        requestAnimationFrame(loop);
      };
    })();
  </script>
