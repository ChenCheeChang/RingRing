      // ==========================================
      // 11. FOREGROUND FLOOR, WOODEN FENCE & +30% ENLARGED JADE BANGLE
      // ==========================================
      function drawFloorAndFence() {
        const floorTop = height * 0.725;
        ctx.save();

        const floorGrad = ctx.createLinearGradient(0, floorTop, 0, height);
        floorGrad.addColorStop(0, '#291106');
        floorGrad.addColorStop(0.45, '#3b190b');
        floorGrad.addColorStop(1, '#140602');
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, floorTop, width, height - floorTop);

        ctx.strokeStyle = 'rgba(12, 4, 1, 0.6)';
        ctx.lineWidth = 1.6;
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath();
          ctx.moveTo(width * 0.5 + i * (width * 0.11), floorTop);
          ctx.lineTo(width * 0.5 + i * (width * 0.24), height);
          ctx.stroke();
        }

        // Foreground Wooden Fence Railing
        const fenceY = height * 0.78;
        const postCount = 6;
        const postSpacing = width / (postCount - 1);

        for (let i = 0; i < postCount; i++) {
          const px = i * postSpacing;
          const pGrad = ctx.createLinearGradient(px - 8, 0, px + 8, 0);
          pGrad.addColorStop(0, '#2e1206');
          pGrad.addColorStop(0.5, '#6e3318');
          pGrad.addColorStop(1, '#210c04');
          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.roundRect(px - 8, fenceY - 12, 16, height - fenceY + 20, 4);
          ctx.fill();
        }

        const railGrad = ctx.createLinearGradient(0, fenceY - 7, 0, fenceY + 14);
        railGrad.addColorStop(0, '#8c4623');
        railGrad.addColorStop(0.45, '#5e2b14');
        railGrad.addColorStop(1, '#2b1005');
        ctx.fillStyle = railGrad;
        ctx.fillRect(0, fenceY - 7, width, 20);

        ctx.strokeStyle = 'rgba(255, 215, 145, 0.42)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, fenceY - 6);
        ctx.lineTo(width, fenceY - 6);
        ctx.stroke();

        // Draw Player's Ready +30% Enlarged Jade Bangle on the railing when PLAYING
        if (gameState === 'PLAYING' && banglesLeft > 0) {
          const hand = getPlayerHandPos();
          let handPullX = 0;
          let handPullY = 0;

          if (activePointerId !== null && isDraggingAim) {
            const dx = pointerCurr.x - pointerStart.x;
            const dy = pointerCurr.y - pointerStart.y;
            if (dy < -15) {
              const aimX = Math.max(width * 0.075, Math.min(width * 0.925, hand.x + dx * 1.45));
              const aimY = Math.max(height * 0.18, Math.min(height * 0.71, hand.y + dy * 1.65));
              handPullX = Math.max(-18, Math.min(18, dx * 0.12));
              handPullY = Math.max(-12, Math.min(12, -dy * 0.04));

              ctx.save();
              ctx.setLineDash([6, 6]);
              ctx.strokeStyle = 'rgba(110, 255, 198, 0.72)';
              ctx.lineWidth = 2.8;
              ctx.beginPath();
              ctx.moveTo(hand.x + handPullX, hand.y + handPullY);
              ctx.quadraticCurveTo((hand.x + aimX) * 0.5, Math.min(hand.y, aimY) - 70, aimX, aimY);
              ctx.stroke();

              // Crisp landing ring reticle matching actual jade bangle landing footprint
              ctx.setLineDash([]);
              ctx.strokeStyle = 'rgba(110, 255, 198, 0.92)';
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.ellipse(aimX, aimY, 26, 15, 0, 0, Math.PI * 2);
              ctx.stroke();
              ctx.fillStyle = 'rgba(110, 255, 198, 0.16)';
              ctx.fill();
              ctx.restore();
            }
          }

          const visibleReserve = Math.min(8, banglesLeft - 1);
          for (let b = 0; b < visibleReserve; b++) {
            drawJadeBangleRing(width * 0.145 + (b % 4) * 16, hand.y + 10 - b * 4.2, BANGLE_STACK_RX, BANGLE_STACK_RY, 0);
          }

          const floatOffset = Math.sin(globalTime * 3.8) * 3.5;
          drawJadeBangleRing(hand.x + handPullX, hand.y + floatOffset + handPullY, BANGLE_BASE_RX, BANGLE_BASE_RY, handPullX * 0.01);
        }

        ctx.restore();
      }

      function drawJadeBangleRing(x, y, rx, ry, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);

        const bandThick = Math.max(5.0, rx * 0.25);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.lineWidth = bandThick * 1.05;
        ctx.beginPath();
        ctx.ellipse(0, 4.5, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#064e3b';
        ctx.lineWidth = bandThick + 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        const jadeGrad = ctx.createLinearGradient(-rx, -ry, rx, ry);
        jadeGrad.addColorStop(0, '#a7f3d0');
        jadeGrad.addColorStop(0.28, '#34d399');
        jadeGrad.addColorStop(0.65, '#059669');
        jadeGrad.addColorStop(0.88, '#047857');
        jadeGrad.addColorStop(1, '#6ee7b7');

        ctx.strokeStyle = jadeGrad;
        ctx.lineWidth = bandThick;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(236, 253, 245, 0.88)';
        ctx.lineWidth = Math.max(1.8, rx * 0.065);
        ctx.beginPath();
        ctx.ellipse(0, -1.2, rx * 0.97, ry * 0.95, 0, Math.PI * 1.08, Math.PI * 1.88);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(167, 243, 208, 0.55)';
        ctx.lineWidth = Math.max(1.2, rx * 0.045);
        ctx.beginPath();
        ctx.ellipse(0, 1.2, rx * 0.95, ry * 0.93, 0, Math.PI * 0.12, Math.PI * 0.82);
        ctx.stroke();

        ctx.restore();
      }

      // ==========================================
      // 12. MAIN 60FPS PHYSICS & RENDER LOOP
      // ==========================================
      let lastTime = performance.now();
      let fireworkSpawnAccum = 0;

      function update(dt) {
        globalTime += dt;

        if (shakeTime > 0) {
          shakeTime = Math.max(0, shakeTime - dt);
          if (shakeTime === 0) shakeIntensity = 0;
        }

        // Ambient warm dust
        for (let i = 0; i < ambientDust.length; i++) {
          const d = ambientDust[i];
          d.x += d.vx * dt + Math.sin(globalTime * 1.5 + d.phase) * 0.15;
          d.y += d.vy * dt;
          if (d.y < height * 0.08) {
            d.y = height * 0.75;
            d.x = Math.random() * width;
          }
          if (d.x < 0) d.x = width;
          if (d.x > width) d.x = 0;
        }

        // Smooth conveyor movement of shelf items using normalized u in [0, 1)
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          const row = shelfRows[it.rowIndex];
          if (!row) continue;

          const trackW = row.right - row.left;
          if (trackW > 0) {
            it.u += (row.speed * dt) / trackW;
            if (it.u >= 1) it.u -= 1;
            else if (it.u < 0) it.u += 1;
            it.x = row.left + it.u * trackW;
          }

          if (it.captured && it.captureAnim < 1) {
            it.captureAnim = Math.min(1, it.captureAnim + dt * 1.85);
          }
        }

        // Tap landing ripples
        for (let i = tapRipples.length - 1; i >= 0; i--) {
          const rp = tapRipples[i];
          rp.r += (rp.maxR - rp.r) * dt * 8.5;
          rp.alpha -= dt * 2.2;
          if (rp.alpha <= 0) tapRipples.splice(i, 1);
        }

        // Thrown Jade Bangles with 3D parabolic lift, foreshortening tilt & dynamic shadow plane
        for (let i = activeBangles.length - 1; i >= 0; i--) {
          const b = activeBangles[i];
          b.elapsed += dt;
          const t = Math.min(1, b.elapsed / b.duration);

          const easeT = 1 - Math.pow(1 - t, 1.65);
          b.x = b.startX + (b.targetX - b.startX) * easeT;
          b.groundY = b.startY + (b.targetY - b.startY) * easeT;
          b.arcLift = Math.sin(t * Math.PI) * b.arcHeight;
          b.y = b.groundY - b.arcLift;
          b.scale = 1.18 - 0.46 * easeT;
          // 3D pitch: slightly taller while climbing, flattening horizontally as it collars the prize
          b.tiltRatio = 0.62 + 0.14 * Math.sin(t * Math.PI) - 0.12 * easeT;
          b.rotation = t * Math.PI * 1.3;

          if (t >= 1) {
            activeBangles.splice(i, 1);
            evaluateBangleLanding(b);
          }
        }

        // Curved shattered jade shards with shelf/floor bounce
        for (let i = jadeShards.length - 1; i >= 0; i--) {
          const sh = jadeShards[i];
          sh.x += sh.vx * dt;
          sh.y += sh.vy * dt;
          sh.vy += 380 * dt;
          sh.rot += sh.vRot * dt;

          if (!sh.bounced && sh.y >= sh.floorY && sh.vy > 0) {
            sh.y = sh.floorY;
            sh.vy = -sh.vy * 0.42;
            sh.vx *= 0.72;
            sh.vRot *= 0.6;
            sh.bounced = true;
          }

          sh.alpha -= dt * 1.25;
          if (sh.alpha <= 0) jadeShards.splice(i, 1);
        }

        // Glow rings & sparkles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          if (p.kind === 'ring') {
            p.r += (p.maxR - p.r) * dt * 7.5;
            p.alpha -= dt * 1.8;
          } else {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 180 * dt;
            p.alpha -= p.decay * dt;
          }
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        // Floating feedback text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy * dt;
          ft.alpha -= dt * 1.15;
          if (ft.alpha <= 0) floatingTexts.splice(i, 1);
        }

        // Victory fullscreen fireworks
        if (gameState === 'VICTORY') {
          fireworkSpawnAccum += dt;
          if (fireworkSpawnAccum >= 0.55) {
            fireworkSpawnAccum = 0;
            spawnFireworkBurst();
          }
        }
        for (let i = fireworks.length - 1; i >= 0; i--) {
          const fw = fireworks[i];
          fw.x += fw.vx * dt;
          fw.y += fw.vy * dt;
          fw.vy += 110 * dt;
          fw.vx *= 0.985;
          fw.alpha -= fw.decay * dt;
          if (fw.alpha <= 0) fireworks.splice(i, 1);
        }
      }

      function render() {
        ctx.save();
        ctx.clearRect(0, 0, width, height);

        // Apply subtle damped micro-shake on jade shatter impact
        if (shakeTime > 0 && shakeIntensity > 0) {
          const mag = shakeIntensity * (shakeTime / 0.14);
          ctx.translate((Math.random() - 0.5) * 2 * mag, (Math.random() - 0.5) * 2 * mag);
        }

        // 1. Night Market Backdrop, Side Decorations & Recessed Shelves
        drawNightMarketBackdrop();

        // 2. Row-by-Row Painter's Algorithm + Strict Per-Compartment Clipping:
        //    Each shelf board is drawn first, then its items are clipped strictly to [innerLeft+2, innerRight-2]
        //    and vertically inside that shelf's own compartment — 100% impossible for +2/+3/+5 or any toy to bleed through!
        const bounds = getBoothInnerBounds();
        const clipX = bounds.innerLeft + 2;
        const clipW = Math.max(0, (bounds.innerRight - 2) - clipX);
        for (let r = 0; r < shelfRows.length; r++) {
          const row = shelfRows[r];
          drawSingleShelfBoard(row);

          ctx.save();
          ctx.beginPath();
          ctx.rect(clipX, row.clipTop, clipW, row.clipBottom - row.clipTop);
          ctx.clip();
          for (let i = 0; i < items.length; i++) {
            if (items[i].rowIndex === r) {
              drawToyItem(items[i]);
            }
          }
          ctx.restore();
        }

        // 3. Rosewood Front Pillars, Red Curtain Valance, Signboard, Bulbs & Lanterns
        drawWoodenStallFrontPillarsAndTop();

        // 4. Foreground Floor, Wooden Fence & Ready +30% Jade Bangle
        drawFloorAndFence();

        // 5. Subtle Tap Ripples
        for (let i = 0; i < tapRipples.length; i++) {
          const rp = tapRipples[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, rp.alpha);
          ctx.strokeStyle = '#a7f3d0';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.58, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 6. Flying Jade Bangles + Dynamic 3D Projected Ground Shadows
        for (let i = 0; i < activeBangles.length; i++) {
          const b = activeBangles[i];
          const rx = BANGLE_BASE_RX * 0.95 * b.scale;
          const ry = rx * b.tiltRatio;

          // Dynamic projected shadow on the shelf/floor directly below the bangle
          const shadowScale = Math.max(0.45, 1 - b.arcLift / 260);
          const shadowAlpha = Math.max(0.12, 0.45 * shadowScale);
          ctx.save();
          ctx.strokeStyle = `rgba(10, 3, 0, ${shadowAlpha})`;
          ctx.lineWidth = Math.max(3, rx * 0.18 * shadowScale);
          ctx.beginPath();
          ctx.ellipse(b.x, b.groundY + 4, rx * shadowScale, rx * 0.5 * shadowScale, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // Actual 3D pitched flying emerald jade bangle
          drawJadeBangleRing(b.x, b.y, rx, ry, b.rotation * 0.12);
        }

        // 7. Realistic Curved Jade Fracture Shards
        for (let i = 0; i < jadeShards.length; i++) {
          const sh = jadeShards[i];
          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.globalAlpha = Math.max(0, sh.alpha);

          ctx.strokeStyle = '#047857';
          ctx.lineWidth = sh.thick + 1.5;
          ctx.lineCap = 'butt';
          ctx.beginPath();
          ctx.arc(0, 0, sh.arcRadius, -sh.arcSpan * 0.5, sh.arcSpan * 0.5);
          ctx.stroke();

          ctx.strokeStyle = '#34d399';
          ctx.lineWidth = sh.thick;
          ctx.beginPath();
          ctx.arc(0, 0, sh.arcRadius, -sh.arcSpan * 0.5, sh.arcSpan * 0.5);
          ctx.stroke();

          ctx.strokeStyle = '#ecfdf5';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(0, -0.8, sh.arcRadius, -sh.arcSpan * 0.4, sh.arcSpan * 0.4);
          ctx.stroke();

          ctx.restore();
        }

        // 8. Hit Glow Rings & Sparkles
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          if (p.kind === 'ring') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.r, p.r * 0.65, 0, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 9. Ambient Warm Night Market Dust
        for (let i = 0; i < ambientDust.length; i++) {
          const d = ambientDust[i];
          ctx.fillStyle = `rgba(255, 220, 140, ${d.alpha * 0.45})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 10. Floating Feedback Texts
        for (let i = 0; i < floatingTexts.length; i++) {
          const ft = floatingTexts[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = '900 17px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = 'rgba(20, 8, 3, 0.92)';
          ctx.lineWidth = 4.5;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        // 11. Subtle Warm Night Market Vignette
        const vig = ctx.createRadialGradient(width * 0.5, height * 0.48, width * 0.35, width * 0.5, height * 0.5, height * 0.72);
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(1, 'rgba(8, 2, 0, 0.36)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, width, height);

        // 12. Victory Fullscreen Fireworks
        for (let i = 0; i < fireworks.length; i++) {
          const fw = fireworks[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, fw.alpha);
          ctx.fillStyle = fw.color;
          ctx.shadowColor = fw.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(fw.x, fw.y, fw.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function resizeCanvas() {
        const frame = document.getElementById('game-frame');
        const rect = frame.getBoundingClientRect();
        width = Math.max(320, rect.width);
        height = Math.max(540, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        initAtmosphereParticles();
        if (shelfRows.length === 0) {
          setupLevel(currentLevelIndex);
        } else {
          // Non-destructive resize preserves live level progress, hits, and bangles!
          rescaleActiveLevelLayout();
        }
        render();
      }

      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        resizeCanvas();
        showHomeScreen();
        lastTime = performance.now();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
