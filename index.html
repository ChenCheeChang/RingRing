<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>套圈圈</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0402;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 35%, #2b1107 0%, #0a0301 100%);
      overflow: hidden;
    }

    #game-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.96);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Safe-area aware HUD spacing for iPhone Notch & Dynamic Island */
    #hud-layer {
      padding-top: max(12px, env(safe-area-inset-top));
    }

    #screen-home {
      padding-bottom: max(54px, calc(env(safe-area-inset-bottom) + 34px));
    }

    /* Tactile App Store Grade Buttons */
    .nm-btn-primary {
      background: linear-gradient(180deg, #ff783d 0%, #d93418 50%, #991707 100%);
      border: 2.5px solid #ffd87a;
      box-shadow: 0 8px 26px rgba(217, 52, 24, 0.58), 0 2px 0 #5c0c02, inset 0 2px 3px rgba(255, 255, 255, 0.5);
      color: #fffaf0;
      text-shadow: 0 2px 4px rgba(70, 8, 0, 0.85);
      transition: transform 0.11s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.11s ease, filter 0.11s ease;
    }

    .nm-btn-primary:active {
      transform: scale(0.95) translateY(2px);
      box-shadow: 0 3px 12px rgba(217, 52, 24, 0.42), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      filter: brightness(0.96);
    }

    .nm-btn-secondary {
      background: linear-gradient(180deg, #522b16 0%, #261107 100%);
      border: 2px solid #edb868;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.72), 0 2px 0 #140803, inset 0 1px 2px rgba(255, 226, 168, 0.38);
      color: #ffe3a8;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
      transition: transform 0.11s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nm-btn-secondary:active {
      transform: scale(0.95) translateY(2px);
    }

    .nm-card {
      background: linear-gradient(180deg, rgba(46, 20, 9, 0.96) 0%, rgba(20, 8, 3, 0.98) 100%);
      border: 2.5px solid #e8ac50;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.92), 0 0 38px rgba(255, 165, 50, 0.24), inset 0 0 24px rgba(255, 196, 100, 0.09);
      animation: modalPop 0.24s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.9) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .hud-pill {
      background: rgba(24, 10, 4, 0.84);
      border: 1.5px solid rgba(255, 206, 120, 0.58);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    .hud-pulse {
      animation: hudBump 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes hudBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="game-frame">
      <canvas id="game-canvas"></canvas>

      <!-- Minimal In-Game HUD (Hidden on Home Screen; difficulty strictly hidden) -->
      <div id="hud-layer" class="hidden absolute top-0 left-0 right-0 z-10 pointer-events-none px-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="hud-pill px-3 py-1 rounded-full flex items-center gap-1.5">
            <span class="text-amber-300 text-xs font-bold tracking-wider">關卡</span>
            <span id="hud-level" class="text-white text-sm font-black">1 / 20</span>
          </div>
          <div id="pill-bangles" class="hud-pill px-3 py-1 rounded-full flex items-center gap-1.5">
            <span class="text-emerald-300 text-xs font-bold">玉鐲</span>
            <span id="hud-bangles" class="text-white text-sm font-black">5</span>
          </div>
          <div id="pill-hits" class="hud-pill px-3 py-1 rounded-full flex items-center gap-1.5">
            <span class="text-rose-300 text-xs font-bold">套中</span>
            <span id="hud-hits" class="text-white text-sm font-black">0</span>
          </div>
        </div>

        <button id="btn-mute" type="button" aria-label="音效開關" class="pointer-events-auto hud-pill w-9 h-9 rounded-full flex items-center justify-center text-amber-200 active:scale-90 transition">
          <span id="mute-icon" class="text-base">🔊</span>
        </button>
      </div>

      <!-- HOME SCREEN: Strictly Minimalist — ONLY two buttons: "開始遊玩" & "遊戲規則", zero extra text -->
      <div id="screen-home" class="absolute inset-0 z-20 flex flex-col items-center justify-end px-8 pointer-events-auto">
        <div class="w-full max-w-[244px] flex flex-col gap-3.5">
          <button id="btn-start-game" type="button" class="nm-btn-primary w-full py-4 rounded-2xl text-xl font-black tracking-widest">
            開始遊玩
          </button>
          <button id="btn-open-rules" type="button" class="nm-btn-secondary w-full py-3.5 rounded-2xl text-lg font-bold tracking-widest">
            遊戲規則
          </button>
        </div>
      </div>

      <!-- RULES MODAL -->
      <div id="modal-rules" class="hidden absolute inset-0 z-30 bg-black/75 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="nm-card w-full max-w-sm rounded-3xl p-6 text-amber-50 flex flex-col gap-4">
          <h2 class="text-2xl font-black text-center text-amber-300 tracking-wider">遊戲規則</h2>
          <ul class="space-y-2.5 text-sm leading-relaxed text-amber-100/95 font-medium">
            <li class="flex items-start gap-2">
              <span class="text-emerald-400 font-bold">●</span>
              <span>點擊攤架上的目標玩具，或由下方圍欄向上滑動拋出翠玉手鐲。</span>
            </li>
            <li class="flex items-start gap-2">
              <span class="text-emerald-400 font-bold">●</span>
              <span>玉鐲落點位於移動物品中心 <strong class="text-amber-300">±15%</strong> 範圍內即判定套中。</span>
            </li>
            <li class="flex items-start gap-2">
              <span class="text-emerald-400 font-bold">●</span>
              <span>每關固定配發 <strong class="text-amber-300">5 個玉鐲</strong>（不跨關累積），套中 <strong class="text-emerald-300">+2 / +3</strong>（第 5 關起新增 <strong class="text-amber-300">+5</strong>）道具可額外增加當關投擲次數。</span>
            </li>
            <li class="flex items-start gap-2">
              <span class="text-emerald-400 font-bold">●</span>
              <span>每關必須套中至少 <strong class="text-amber-300">1 個物品</strong> 才能過關，共 <strong class="text-amber-300">20 關</strong>。</span>
            </li>
          </ul>
          <button id="btn-close-rules" type="button" class="nm-btn-primary w-full py-3 rounded-xl text-base font-black tracking-widest mt-2">
            返回
          </button>
        </div>
      </div>

      <!-- LEVEL CLEAR OVERLAY: Congratulatory text + "進入下一關" button -->
      <div id="modal-clear" class="hidden absolute inset-0 z-30 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="nm-card w-full max-w-xs rounded-3xl p-7 text-center flex flex-col items-center gap-5">
          <div class="text-4xl">🏮</div>
          <h2 id="clear-title" class="text-2xl font-black text-amber-300 tracking-wider leading-snug">
            恭喜過關！
          </h2>
          <p id="clear-subtitle" class="text-amber-100/90 text-sm font-medium">
            神準出手，成功套中目標獎品！
          </p>
          <button id="btn-next-level" type="button" class="nm-btn-primary w-full py-3.5 rounded-2xl text-lg font-black tracking-widest">
            進入下一關
          </button>
        </div>
      </div>

      <!-- LEVEL RETRY OVERLAY (When 0 items hit and bangles run out) -->
      <div id="modal-retry" class="hidden absolute inset-0 z-30 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="nm-card w-full max-w-xs rounded-3xl p-7 text-center flex flex-col items-center gap-5">
          <div class="text-4xl">💫</div>
          <h2 class="text-2xl font-black text-amber-300 tracking-wider">
            差一點點！
          </h2>
          <p class="text-amber-100/90 text-sm font-medium">
            需套中至少 1 個物品即可過關
          </p>
          <button id="btn-retry-level" type="button" class="nm-btn-primary w-full py-3.5 rounded-2xl text-lg font-black tracking-widest">
            再試一次
          </button>
        </div>
      </div>

      <!-- ALL 20 LEVELS CLEARED: Fullscreen Firework Celebration Screen -->
      <div id="modal-victory" class="hidden absolute inset-0 z-30 pointer-events-auto flex flex-col items-center justify-between py-14 px-6">
        <div class="mt-6 text-center pointer-events-none">
          <div class="inline-block px-6 py-3.5 rounded-3xl bg-black/60 border border-amber-300/65 backdrop-blur-md shadow-2xl">
            <h1 class="text-3xl font-black text-amber-300 tracking-widest drop-shadow-md">
              恭喜全部通關！
            </h1>
            <p id="victory-stats" class="text-amber-100 text-sm font-bold mt-1.5">
              夜市套圈圈大滿貫達成
            </p>
          </div>
        </div>
        <div class="w-full max-w-[244px] mb-4">
          <button id="btn-play-again" type="button" class="nm-btn-primary w-full py-4 rounded-2xl text-lg font-black tracking-widest">
            開始遊玩
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ==========================================
      // 1. MASTERED WEB AUDIO ENGINE (DynamicsCompressor + Lookahead 60s BGM + Physical Modal Jade Shatter)
      // ==========================================
      class SoundSystem {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.compressor = null;
          this.muted = false;
          this.bgmPlaying = false;
          this.schedulerId = null;
          this.stepIndex = 0;
          this.nextNoteTime = 0;
          this.bgmSequence = this.build60SecondCircusScore();
        }

        build60SecondCircusScore() {
          // 25 bars × 16 steps = 400 steps × 0.150s = EXACTLY 60.000 seconds per loop
          const N = {
            _: 0,
            G2: 98.00, A2: 110.00, B2: 123.47,
            C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, FS3: 185.00, G3: 196.00, A3: 220.00, AS3: 233.08, B3: 246.94,
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, FS4: 369.99, G4: 392.00, A4: 440.00, AS4: 466.16, B4: 493.88,
            C5: 523.25, CS5: 554.37, D5: 587.33, DS5: 622.25, E5: 659.25, F5: 698.46, FS5: 739.99, G5: 783.99, GS5: 830.61, A5: 880.00, AS5: 932.33, B5: 987.77,
            C6: 1046.50, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98
          };

          const phrasesM = {
            A1: [N.C5, N.E5, N.G5, N.E5, N.A5, N.G5, N.F5, N.E5, N.D5, N.F5, N.A5, N.F5, N.G5, N.E5, N.C5, N.D5],
            A2: [N.E5, N.G5, N.C6, N.B5, N.A5, N.G5, N.FS5, N.G5, N.A5, N.F5, N.D5, N.G5, N.C5, N._,  N.G5, N._ ],
            A3: [N.C6, N.B5, N.AS5, N.A5, N.GS5, N.G5, N.FS5, N.F5, N.E5, N.G5, N.C6, N.G5, N.E5, N.C5, N.D5, N.E5],
            A4: [N.F5, N.A5, N.D6, N.C6, N.B5, N.G5, N.A5, N.B5, N.C6, N.G5, N.E5, N.G5, N.C6, N._,  N.C6, N._ ],

            B1: [N.G5, N.B5, N.D6, N.B5, N.A5, N.FS5, N.D5, N.FS5, N.G5, N.B5, N.D6, N.B5, N.A5, N.D6, N.B5, N.G5],
            B2: [N.E5, N.FS5, N.G5, N.A5, N.B5, N.D6, N.C6, N.A5, N.G5, N.B5, N.A5, N.FS5, N.G5, N.D5, N.G5, N._ ],
            B3: [N.B5, N.G5, N.D5, N.G5, N.C6, N.A5, N.FS5, N.A5, N.B5, N.G5, N.E5, N.G5, N.A5, N.FS5, N.D5, N._ ],
            B4: [N.G5, N.A5, N.B5, N.C6, N.D6, N.B5, N.G5, N.D6, N.C6, N.A5, N.FS5, N.D5, N.G5, N._,  N.G4, N.B4],

            C1: [N.F5, N.A5, N.C6, N.A5, N.AS5, N.D6, N.C6, N.A5, N.G5, N.AS5, N.E5, N.G5, N.F5, N.C5, N.D5, N.E5],
            C2: [N.F5, N.A5, N.C6, N.F6, N.E6, N.D6, N.C6, N.AS5, N.A5, N.C6, N.G5, N.E5, N.F5, N._,  N.C5, N._ ],
            C3: [N.D5, N.F5, N.A5, N.D6, N.C6, N.A5, N.F5, N.A5, N.G5, N.AS5, N.D6, N.C6, N.AS5, N.G5, N.E5, N.C5],
            C4: [N.F5, N.G5, N.A5, N.AS5, N.C6, N.D6, N.C6, N.A5, N.G5, N.C6, N.AS5, N.E5, N.F5, N._,  N.G5, N._ ],

            D1: [N.C6, N.G5, N.E5, N.G5, N.C6, N.D6, N.E6, N.C6, N.D6, N.B5, N.G5, N.B5, N.D6, N.E6, N.F6, N.D6],
            D2: [N.E6, N.C6, N.G5, N.E5, N.A5, N.C6, N.F6, N.D6, N.C6, N.G5, N.B5, N.D6, N.C6, N._,  N.G5, N._ ],
            D3: [N.E5, N.F5, N.FS5, N.G5, N.A5, N.AS5, N.B5, N.C6, N.D6, N.B5, N.G5, N.F5, N.E5, N.G5, N.C6, N.E6],
            D4: [N.D6, N.C6, N.B5, N.A5, N.G5, N.F5, N.E5, N.D5, N.C5, N.G5, N.E5, N.C6, N.G5, N.B5, N.C6, N._ ]
          };

          const phrasesB = {
            A1: [N.C3, N.C4, N.G2, N.C4, N.C3, N.C4, N.G2, N.C4, N.D3, N.B3, N.G2, N.B3, N.C3, N.C4, N.G2, N.B2],
            A2: [N.C3, N.C4, N.E3, N.C4, N.F3, N.C4, N.D3, N.C4, N.G3, N.B3, N.G2, N.B3, N.C3, N.G2, N.C3, N._ ],
            A3: [N.C3, N.C4, N.G2, N.C4, N.C3, N.C4, N.G2, N.C4, N.C3, N.C4, N.E3, N.C4, N.G3, N.B3, N.D3, N.G2],
            A4: [N.F3, N.A3, N.D3, N.A3, N.G3, N.B3, N.G2, N.B3, N.C3, N.G3, N.E3, N.G3, N.C3, N._,  N.G2, N._ ],

            B1: [N.G2, N.B3, N.D3, N.B3, N.D3, N.A3, N.A2, N.A3, N.G2, N.B3, N.D3, N.B3, N.D3, N.A3, N.G2, N.B3],
            B2: [N.C3, N.G3, N.E3, N.G3, N.G2, N.B3, N.A2, N.C4, N.D3, N.A3, N.D3, N.FS3, N.G2, N.D3, N.G2, N._ ],
            B3: [N.G2, N.B3, N.D3, N.B3, N.D3, N.A3, N.FS3, N.A3, N.E3, N.B3, N.B2, N.G3, N.D3, N.A3, N.D3, N.C3],
            B4: [N.B2, N.G3, N.D3, N.G3, N.G2, N.B3, N.B2, N.G3, N.D3, N.A3, N.A2, N.FS3, N.G2, N._,  N.G2, N._ ],

            C1: [N.F3, N.A3, N.C3, N.A3, N.AS3, N.D4, N.F3, N.C4, N.C3, N.AS3, N.G2, N.AS3, N.F3, N.A3, N.C3, N.G3],
            C2: [N.F3, N.A3, N.C3, N.A3, N.AS3, N.D4, N.G3, N.AS3, N.C3, N.A3, N.C3, N.G3, N.F3, N.C3, N.F3, N._ ],
            C3: [N.D3, N.A3, N.A2, N.A3, N.F3, N.C4, N.C3, N.A3, N.G3, N.AS3, N.D3, N.G3, N.C3, N.G3, N.C3, N.E3],
            C4: [N.F3, N.A3, N.C3, N.A3, N.F3, N.C4, N.A2, N.C4, N.C3, N.AS3, N.C3, N.G3, N.F3, N._,  N.G2, N._ ],

            D1: [N.C3, N.C4, N.G2, N.C4, N.C3, N.C4, N.E3, N.C4, N.G2, N.B3, N.D3, N.B3, N.G2, N.B3, N.B2, N.G3],
            D2: [N.C3, N.C4, N.E3, N.C4, N.F3, N.C4, N.D3, N.A3, N.G2, N.B3, N.G2, N.B3, N.C3, N.G2, N.C3, N._ ],
            D3: [N.C3, N.G3, N.E3, N.G3, N.F3, N.A3, N.FS3, N.A3, N.G3, N.B3, N.D3, N.B3, N.C3, N.G3, N.E3, N.C3],
            D4: [N.G2, N.B3, N.D3, N.B3, N.G2, N.B3, N.B2, N.G3, N.C3, N.G2, N.E3, N.C3, N.G2, N.G2, N.C3, N._ ]
          };

          const barOrder = [
            'A1', 'A2', 'A1', 'A3', 'A1', 'A4',
            'B1', 'B2', 'B3', 'B4', 'B1', 'B2',
            'C1', 'C2', 'C3', 'C4', 'C1', 'C2',
            'D1', 'D2', 'D3', 'D4', 'A1', 'D3', 'D4'
          ];

          const melody = [];
          const bass = [];
          barOrder.forEach((key) => {
            melody.push(...phrasesM[key]);
            bass.push(...phrasesB[key]);
          });
          return { melody, bass, stepSec: 0.150 };
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.compressor = this.ctx.createDynamicsCompressor();
              this.compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
              this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
              this.compressor.ratio.setValueAtTime(6, this.ctx.currentTime);
              this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
              this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.setValueAtTime(0.92, this.ctx.currentTime);

              this.compressor.connect(this.masterGain);
              this.masterGain.connect(this.ctx.destination);
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        getOutputNode() {
          return this.compressor || (this.ctx ? this.ctx.destination : null);
        }

        toggleMute() {
          this.muted = !this.muted;
          const iconEl = document.getElementById('mute-icon');
          if (iconEl) {
            iconEl.textContent = this.muted ? '🔇' : '🔊';
          }
          if (this.muted) {
            this.stopBGM();
          } else {
            this.init();
            this.startBGM();
          }
        }

        scheduleBGMNote(stepIdx, time) {
          const out = this.getOutputNode();
          if (!out || !this.ctx) return;

          const { melody, bass } = this.bgmSequence;
          const idx = stepIdx % melody.length; // 0..399
          const barIdx = Math.floor(idx / 16);
          const isTrio = barIdx >= 12 && barIdx < 18;
          const isFinale = barIdx >= 18;

          const mFreq = melody[idx];
          if (mFreq > 0) {
            const osc = this.ctx.createOscillator();
            const sub = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = isTrio ? 'sine' : 'triangle';
            sub.type = isFinale ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(mFreq, time);
            sub.frequency.setValueAtTime(mFreq * 2, time);

            const peak = isFinale ? 0.050 : 0.042;
            gain.gain.setValueAtTime(0.0008, time);
            gain.gain.linearRampToValueAtTime(peak, time + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0008, time + 0.135);

            osc.connect(gain);
            sub.connect(gain);
            gain.connect(out);
            osc.start(time);
            sub.start(time);
            osc.stop(time + 0.145);
            sub.stop(time + 0.145);

            if ((isTrio || isFinale) && idx % 4 === 0) {
              const bell = this.ctx.createOscillator();
              const bGain = this.ctx.createGain();
              bell.type = 'sine';
              bell.frequency.setValueAtTime(mFreq * 2, time);
              bGain.gain.setValueAtTime(0.016, time);
              bGain.gain.exponentialRampToValueAtTime(0.0006, time + 0.21);
              bell.connect(bGain);
              bGain.connect(out);
              bell.start(time);
              bell.stop(time + 0.22);
            }
          }

          const bFreq = bass[idx];
          if (bFreq > 0) {
            const bOsc = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            const isOffbeat = idx % 2 === 1;
            bOsc.type = isOffbeat ? 'square' : 'triangle';
            bOsc.frequency.setValueAtTime(bFreq, time);

            bGain.gain.setValueAtTime(0.0008, time);
            bGain.gain.linearRampToValueAtTime(isOffbeat ? 0.018 : 0.036, time + 0.009);
            bGain.gain.exponentialRampToValueAtTime(0.0008, time + 0.115);

            bOsc.connect(bGain);
            bGain.connect(out);
            bOsc.start(time);
            bOsc.stop(time + 0.125);
          }
        }

        startBGM() {
          this.init();
          if (!this.ctx || this.muted || this.bgmPlaying) return;
          this.bgmPlaying = true;
          this.nextNoteTime = this.ctx.currentTime + 0.04;

          const lookaheadMs = 35;
          const scheduleAheadSec = 0.14;

          const scheduler = () => {
            if (!this.bgmPlaying || this.muted || !this.ctx) return;
            while (this.nextNoteTime < this.ctx.currentTime + scheduleAheadSec) {
              this.scheduleBGMNote(this.stepIndex, this.nextNoteTime);
              this.nextNoteTime += this.bgmSequence.stepSec;
              this.stepIndex = (this.stepIndex + 1) % this.bgmSequence.melody.length;
            }
          };

          this.schedulerId = setInterval(scheduler, lookaheadMs);
          scheduler();
        }

        stopBGM() {
          this.bgmPlaying = false;
          if (this.schedulerId) {
            clearInterval(this.schedulerId);
            this.schedulerId = null;
          }
        }

        // Physical air-swish when tossing jade bangle (zero cartoon pitch slide)
        playToss() {
          const out = this.getOutputNode();
          if (this.muted || !this.ctx || !out) return;
          const now = this.ctx.currentTime;
          const dur = 0.12;
          const bufferSize = Math.floor(this.ctx.sampleRate * dur);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = Math.sin((i / bufferSize) * Math.PI);
            data[i] = (Math.random() * 2 - 1) * env;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(780, now);
          filter.Q.setValueAtTime(2.3, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.085, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(out);
          noise.start(now);
        }

        // Crisp Jade-on-Wood Collar Clack + Crystalline Chime on Hit
        playHit(isBonus = false, streak = 1) {
          const out = this.getOutputNode();
          if (this.muted || !this.ctx || !out) return;
          const now = this.ctx.currentTime;

          // Physical jade-on-wood collar clack
          const clackOsc = this.ctx.createOscillator();
          const clackGain = this.ctx.createGain();
          clackOsc.type = 'sine';
          clackOsc.frequency.setValueAtTime(1960, now);
          clackGain.gain.setValueAtTime(0.18, now);
          clackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.042);
          clackOsc.connect(clackGain);
          clackGain.connect(out);
          clackOsc.start(now);
          clackOsc.stop(now + 0.048);

          // Harmonic chime (slight pitch sparkle boost on consecutive streaks)
          const mult = streak >= 3 ? 1.122 : (streak === 2 ? 1.059 : 1.0);
          const notes = isBonus ? [1046.5, 1318.5, 1567.98, 2093.0] : [1046.5, 1318.5, 1567.98];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq * mult, now + 0.02 + i * 0.048);
            gain.gain.setValueAtTime(0.135, now + 0.02 + i * 0.048);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.02 + i * 0.048 + 0.36);
            osc.connect(gain);
            gain.connect(out);
            osc.start(now + 0.02 + i * 0.048);
            osc.stop(now + 0.02 + i * 0.048 + 0.38);
          });
        }

        // REALISTIC PHYSICAL JADE BANGLE SHATTER (Zero pitch slides, modal crystal synthesis)
        playShatter() {
          const out = this.getOutputNode();
          if (this.muted || !this.ctx || !out) return;
          const now = this.ctx.currentTime;
          const sr = this.ctx.sampleRate;

          // Stage 1: Hard initial fracture transient
          const crackDur = 0.045;
          const crackLen = Math.floor(sr * crackDur);
          const crackBuf = this.ctx.createBuffer(1, crackLen, sr);
          const crackData = crackBuf.getChannelData(0);
          for (let i = 0; i < crackLen; i++) {
            const env = Math.exp(-i / (sr * 0.006));
            const crackle = Math.random() > 0.35 ? 1.0 : 0.2;
            crackData[i] = (Math.random() * 2 - 1) * env * crackle;
          }
          const crackSrc = this.ctx.createBufferSource();
          crackSrc.buffer = crackBuf;

          const hpFilter = this.ctx.createBiquadFilter();
          hpFilter.type = 'highpass';
          hpFilter.frequency.setValueAtTime(2250, now);

          const crackGain = this.ctx.createGain();
          crackGain.gain.setValueAtTime(0.55, now);
          crackGain.gain.exponentialRampToValueAtTime(0.001, now + crackDur);

          crackSrc.connect(hpFilter);
          hpFilter.connect(crackGain);
          crackGain.connect(out);
          crackSrc.start(now);

          // Hardwood surface impact thud
          const woodOsc = this.ctx.createOscillator();
          const woodGain = this.ctx.createGain();
          woodOsc.type = 'sine';
          woodOsc.frequency.setValueAtTime(162, now);
          woodGain.gain.setValueAtTime(0.24, now);
          woodGain.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
          woodOsc.connect(woodGain);
          woodGain.connect(out);
          woodOsc.start(now);
          woodOsc.stop(now + 0.036);

          // Stage 2: Fixed high-frequency jade crystal fracture modes
          const primaryModes = [
            { freq: 3180, amp: 0.16, decay: 0.045 },
            { freq: 4460, amp: 0.15, decay: 0.038 },
            { freq: 5890, amp: 0.13, decay: 0.032 },
            { freq: 7420, amp: 0.10, decay: 0.026 },
            { freq: 9150, amp: 0.08, decay: 0.020 }
          ];
          primaryModes.forEach((m) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(m.freq + (Math.random() - 0.5) * 70, now);
            g.gain.setValueAtTime(m.amp, now);
            g.gain.exponentialRampToValueAtTime(0.0008, now + m.decay);
            osc.connect(g);
            g.connect(out);
            osc.start(now);
            osc.stop(now + m.decay + 0.005);
          });

          // Stage 3: 14 cascading jade shard skitter clicks
          const shardCount = 14;
          for (let s = 0; s < shardCount; s++) {
            const delay = 0.008 + Math.pow(s / shardCount, 1.45) * 0.26 + Math.random() * 0.015;
            const tStart = now + delay;
            const distanceAtten = Math.pow(1 - s / (shardCount + 2), 1.3);

            const baseFreq = 3400 + Math.random() * 4800;
            const modeRatios = [1.0, 1.414];
            const ringDur = 0.018 + Math.random() * 0.032;

            modeRatios.forEach((ratio, rIdx) => {
              const sOsc = this.ctx.createOscillator();
              const sGain = this.ctx.createGain();
              sOsc.type = 'sine';
              sOsc.frequency.setValueAtTime(baseFreq * ratio, tStart);
              const peak = (rIdx === 0 ? 0.11 : 0.065) * distanceAtten;
              sGain.gain.setValueAtTime(0.0005, tStart);
              sGain.gain.linearRampToValueAtTime(peak, tStart + 0.001);
              sGain.gain.exponentialRampToValueAtTime(0.0005, tStart + ringDur);

              sOsc.connect(sGain);
              sGain.connect(out);
              sOsc.start(tStart);
              sOsc.stop(tStart + ringDur + 0.004);
            });

            const clickSamples = Math.floor(sr * 0.005);
            const clickBuf = this.ctx.createBuffer(1, clickSamples, sr);
            const cData = clickBuf.getChannelData(0);
            for (let k = 0; k < clickSamples; k++) {
              cData[k] = (Math.random() * 2 - 1) * Math.exp(-k / (sr * 0.0012));
            }
            const cSrc = this.ctx.createBufferSource();
            cSrc.buffer = clickBuf;
            const cBp = this.ctx.createBiquadFilter();
            cBp.type = 'bandpass';
            cBp.frequency.setValueAtTime(baseFreq, tStart);
            cBp.Q.setValueAtTime(4.0, tStart);
            const cGain = this.ctx.createGain();
            cGain.gain.setValueAtTime(0.22 * distanceAtten, tStart);
            cSrc.connect(cBp);
            cBp.connect(cGain);
            cGain.connect(out);
            cSrc.start(tStart);
          }
        }

        // Pyrotechnic firework burst
        playFirework() {
          const out = this.getOutputNode();
          if (this.muted || !this.ctx || !out) return;
          const now = this.ctx.currentTime;
          const sr = this.ctx.sampleRate;
          const dur = 0.26;
          const len = Math.floor(sr * dur);
          const buf = this.ctx.createBuffer(1, len, sr);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.055));
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          const lp = this.ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(950, now);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          src.connect(lp);
          lp.connect(gain);
          gain.connect(out);
          src.start(now);
        }
      }

      const sound = new SoundSystem();

      // ==========================================
      // 2. 20-LEVEL CONFIGURATIONS (Internal Difficulty 10% + 3%/level, Capped Total Bangles <= totalItems)
      // ==========================================
      const LEVEL_CONFIGS = Array.from({ length: 20 }, (_, i) => {
        const level = i + 1;
        const difficultyPct = 10 + i * 3; // 10%, 13%, 16% ... 67% (strictly internal)
        let perRow;
        let bonusList;
        // Strict invariant: 5 + sum(bonusList) <= totalItems, zero +1 props, +5 from Level 5+
        if (level <= 3) {
          perRow = [3, 3, 3]; // 9 items
          bonusList = level === 1 ? [2] : (level === 2 ? [3] : [2, 2]);
        } else if (level === 4) {
          perRow = [2, 3, 2, 3]; // 10 items
          bonusList = [2, 3];
        } else if (level <= 8) {
          perRow = [3, 3, 3, 3]; // 12 items
          bonusList = [5, 2];
        } else if (level <= 12) {
          perRow = [3, 3, 3, 3, 3]; // 15 items
          bonusList = [5, 2, 3];
        } else if (level <= 16) {
          perRow = [3, 4, 3, 4, 3]; // 17 items
          bonusList = [5, 2, 2, 3];
        } else {
          perRow = [4, 4, 4, 4, 4]; // 20 items
          bonusList = [5, 2, 2, 3, 3];
        }
        const rows = perRow.length;
        const totalItems = perRow.reduce((a, b) => a + b, 0);
        const baseSpeed = 24 * (1 + (difficultyPct - 10) / 35);
        return { level, difficultyPct, rows, totalItems, perRow, baseSpeed, bonusList };
      });

      // ==========================================
      // 3. ENLARGED, HIGH-DETAIL TOY CATALOG BY SHELF TIER
      // ==========================================
      const TOY_TIERS = {
        top: [
          { type: 'teddy_giant',   name: '巨型泰迪熊',   scale: 1.22, glow: false },
          { type: 'mecha_figure',  name: '巨型機器公仔', scale: 1.22, glow: true },
          { type: 'glow_star_orb', name: '發光星願燈',   scale: 1.16, glow: true },
          { type: 'panda_plush',   name: '大型貓熊玩偶', scale: 1.20, glow: false }
        ],
        middle: [
          { type: 'retro_car',     name: '復古小跑車',   scale: 1.06, glow: false },
          { type: 'bunny_doll',    name: '粉紅兔娃娃',   scale: 1.08, glow: false },
          { type: 'shiba_plush',   name: '柴犬毛絨玩偶', scale: 1.06, glow: false },
          { type: 'daruma_doll',   name: '招財達摩公仔', scale: 1.05, glow: false }
        ],
        bottom: [
          { type: 'candy_box',     name: '懷舊糖果盒',   scale: 0.94, glow: false },
          { type: 'keychain_charm',name: '御守鑰匙圈',   scale: 0.92, glow: false },
          { type: 'mini_duck',     name: '迷你小黃鴨',   scale: 0.94, glow: false },
          { type: 'capsule_toy',   name: '驚喜迷你扭蛋', scale: 0.92, glow: false }
        ]
      };

      // ==========================================
      // 4. GAME STATE, TIMERS & CAMERA JUICE
      // ==========================================
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');

      let width = 390;
      let height = 844;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      let gameState = 'HOME'; // 'HOME', 'PLAYING', 'CLEAR', 'RETRY', 'VICTORY'
      let currentLevelIndex = 0; // 0..19
      let banglesLeft = 5;
      let hitsThisLevel = 0;
      let totalHitsAllLevels = 0;
      let consecutiveHits = 0;
      let globalTime = 0;

      // Tracked timers so zero stale callbacks ever fire across state transitions
      let roundEndTimer = null;
      let victoryFireworkTimer = null;

      // Damped screen micro-shake & tap landing ripples
      let shakeTime = 0;
      let shakeIntensity = 0;
      let tapRipples = [];

      let shelfRows = [];
      let items = [];
      let activeBangles = [];
      let jadeShards = [];
      let particles = [];
      let floatingTexts = [];
      let fireworks = [];
      let ambientDust = [];
      let distantBokeh = [];

      // Single-pointer tracking (prevents multi-touch / palm touch lockups on iPhone)
      let activePointerId = null;
      let pointerStart = { x: 0, y: 0, time: 0 };
      let pointerCurr = { x: 0, y: 0 };
      let isDraggingAim = false;

      // Enlarged +30% Jade Bangle dimensions
      const BANGLE_BASE_RX = 47;
      const BANGLE_BASE_RY = 29;
      const BANGLE_STACK_RX = 26;
      const BANGLE_STACK_RY = 16;

      function clearPendingTimers() {
        if (roundEndTimer !== null) {
          clearTimeout(roundEndTimer);
          roundEndTimer = null;
        }
        if (victoryFireworkTimer !== null) {
          clearTimeout(victoryFireworkTimer);
          victoryFireworkTimer = null;
        }
      }

      function triggerMicroShake(intensity, duration) {
        shakeIntensity = Math.max(shakeIntensity, intensity);
        shakeTime = Math.max(shakeTime, duration);
      }

      function pulseHudPill(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('hud-pulse');
        void el.offsetWidth;
        el.classList.add('hud-pulse');
      }

      // ==========================================
      // 5. GEOMETRY & NON-DESTRUCTIVE RESIZE SYSTEM
      // ==========================================
      function initAtmosphereParticles() {
        ambientDust = [];
        for (let i = 0; i < 38; i++) {
          ambientDust.push({
            x: Math.random() * width,
            y: Math.random() * height * 0.84,
            r: 1.0 + Math.random() * 2.2,
            vx: (Math.random() - 0.5) * 9,
            vy: -4 - Math.random() * 8,
            alpha: 0.25 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2
          });

        distantBokeh = [];
        const bokehColors = [
          'rgba(255, 192, 95, 0.22)',
          'rgba(255, 110, 55, 0.18)',
          'rgba(255, 232, 155, 0.20)',
          'rgba(235, 65, 50, 0.16)'
        ];
        for (let i = 0; i < 18; i++) {
          distantBokeh.push({

          });

      }

      function getBoothInnerBounds() {
        const stallLeft = width * 0.052;
        const stallRight = width * 0.948;
        const pillarW = 18;
        return {
          stallLeft,
          stallRight,
          pillarW,
          innerLeft: stallLeft + pillarW - 2,
          innerRight: stallRight - pillarW + 2
        };
      }

      function computeShelfLayout(rowCount) {
        const { stallLeft, stallRight, innerLeft, innerRight } = getBoothInnerBounds();
        const shelfTopY = height * 0.265;
        const shelfBottomY = height * 0.680;
        const rowSpan = rowCount > 1 ? (shelfBottomY - shelfTopY) / (rowCount - 1) : (height * 0.16);

        // Track padding strictly exceeds max toy visual half-width + glow aura (~84px) so every toy
        // and +2/+3/+5 token is 100% hidden behind the solid side pillars before wrapping around.
        const hidePad = Math.max(82, Math.min(width * 0.22, 94));

        const layouts = [];
        for (let r = 0; r < rowCount; r++) {
          const y = rowCount === 1 ? (shelfTopY + shelfBottomY) * 0.5 : shelfTopY + r * rowSpan;
          const depthRatio = r / Math.max(1, rowCount - 1);
          const boardLeft = stallLeft + 4;
          const boardRight = stallRight - 4;
          // Vertical compartment ceiling: strictly below the front lip of the shelf above
          const clipTop = r === 0 ? height * 0.150 : (y - rowSpan + 16);
          const clipBottom = y + 10;
          layouts.push({
            y,
            rowSpan,
            depthRatio,
            boardLeft,
            boardRight,
            innerLeft,
            innerRight,
            clipTop,
            clipBottom,
            left: innerLeft - hidePad,
            right: innerRight + hidePad
          });
        }
        return layouts;
      }

      function setupLevel(levelIdx) {
        clearPendingTimers();
        currentLevelIndex = Math.max(0, Math.min(19, levelIdx));
        const cfg = LEVEL_CONFIGS[currentLevelIndex];

        banglesLeft = 5;
        hitsThisLevel = 0;
        consecutiveHits = 0;
        activeBangles = [];
        jadeShards = [];
        particles = [];
        floatingTexts = [];
        tapRipples = [];
        activePointerId = null;
        isDraggingAim = false;

        updateHUD();

        const rowCount = cfg.rows;
        const rowLayouts = computeShelfLayout(rowCount);

        shelfRows = [];
        items = [];

        const totalSlots = cfg.perRow.reduce((a, b) => a + b, 0);
        const plannedBonuses = (cfg.bonusList || [2]).slice();
        const safeBonuses = [];
        let runningTotalBangles = 5;
        for (let i = 0; i < plannedBonuses.length; i++) {
          const val = plannedBonuses[i];
          if (runningTotalBangles + val <= totalSlots) {
            safeBonuses.push(val);
            runningTotalBangles += val;
          }
        }

        // Distribute bonus props across distinct rows when possible so they aren't clumped together
        const bonusSlotList = [];
        const bonusIndices = new Set();
        while (bonusIndices.size < safeBonuses.length && bonusIndices.size < totalSlots - 1) {
          const candidate = Math.floor(Math.random() * totalSlots);
          if (!bonusIndices.has(candidate)) {
            bonusIndices.add(candidate);
            bonusSlotList.push(candidate);
          }
        }

        const bonusValueMap = new Map();
        bonusSlotList.forEach((slotIdx, idx) => {
          bonusValueMap.set(slotIdx, safeBonuses[idx]);
        });

        let slotCounter = 0;

        for (let r = 0; r < rowCount; r++) {
          const lay = rowLayouts[r];
          let tierKey = 'middle';
          if (r === 0) {
            tierKey = 'top';
          } else if (r === rowCount - 1) {
            tierKey = 'bottom';
          } else if (rowCount >= 5 && r === 1) {
            tierKey = 'top';
          } else if (rowCount >= 5 && r === rowCount - 2) {
            tierKey = 'bottom';
          }

          const dir = (r % 2 === 0) ? 1 : -1;
          const speed = cfg.baseSpeed * (0.92 + (r % 3) * 0.08) * dir;

          shelfRows.push({
            rowIndex: r,
            y: lay.y,
            rowSpan: lay.rowSpan,
            depthRatio: lay.depthRatio,
            tierKey: tierKey,
            speed: speed,
            left: lay.left,
            right: lay.right,
            boardLeft: lay.boardLeft,
            boardRight: lay.boardRight,
            innerLeft: lay.innerLeft,
            innerRight: lay.innerRight,
            clipTop: lay.clipTop,
            clipBottom: lay.clipBottom
          });

          const countInRow = cfg.perRow[r];
          const trackW = lay.right - lay.left;
          const tierCatalog = TOY_TIERS[tierKey];
          const densityFactor = rowCount === 3 ? 1.0 : (rowCount === 4 ? 0.90 : 0.82);
          const maxRowRadius = Math.min(width * 0.092, lay.rowSpan * 0.42, 35.5);

          for (let c = 0; c < countInRow; c++) {
            const isBonus = bonusValueMap.has(slotCounter);
            const bonusValue = isBonus ? bonusValueMap.get(slotCounter) : 0;
            const tpl = tierCatalog[(r * 3 + c) % tierCatalog.length];
            const itemScale = isBonus ? 0.94 : tpl.scale;
            const baseRadius = maxRowRadius * itemScale * densityFactor;
            // Normalized track coordinate u in [0, 1) so resizing never resets item positions!
            const u = (c + 0.5) / countInRow;

            items.push({
              id: `item_${r}_${c}`,
              rowIndex: r,
              u: u,
              x: lay.left + u * trackW,
              y: lay.y,
              tplScale: itemScale,
              baseRadius: baseRadius,
              toyWidth: baseRadius * 2,
              type: isBonus ? 'bonus_token' : tpl.type,
              name: isBonus ? `+${bonusValue} 玉鐲` : tpl.name,
              bonusValue: bonusValue,
              glow: isBonus || tpl.glow,
              tierKey: tierKey,
              captured: false,
              captureAnim: 0, // 0 -> 1 over 0.55s (0..0.38 collar settle + hop, 0.38..1.0 float out)
              bobPhase: Math.random() * Math.PI * 2
            });

            slotCounter++;
          }
        }
      }

      // Non-destructive layout rescaler on window/viewport resize (fixes iOS Safari address-bar reset bug!)
      function rescaleActiveLevelLayout() {
        const cfg = LEVEL_CONFIGS[currentLevelIndex];
        if (!cfg || shelfRows.length === 0) {
          setupLevel(currentLevelIndex);
          return;
        }
        const rowCount = cfg.rows;
        const rowLayouts = computeShelfLayout(rowCount);
        const densityFactor = rowCount === 3 ? 1.0 : (rowCount === 4 ? 0.90 : 0.82);

        for (let r = 0; r < shelfRows.length && r < rowLayouts.length; r++) {
          const lay = rowLayouts[r];
          shelfRows[r].y = lay.y;
          shelfRows[r].rowSpan = lay.rowSpan;
          shelfRows[r].depthRatio = lay.depthRatio;
          shelfRows[r].left = lay.left;
          shelfRows[r].right = lay.right;
          shelfRows[r].boardLeft = lay.boardLeft;
          shelfRows[r].boardRight = lay.boardRight;
          shelfRows[r].innerLeft = lay.innerLeft;
          shelfRows[r].innerRight = lay.innerRight;
          shelfRows[r].clipTop = lay.clipTop;
          shelfRows[r].clipBottom = lay.clipBottom;
        }

        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          const row = shelfRows[it.rowIndex];
          if (!row) continue;
          const trackW = row.right - row.left;
          const maxRowRadius = Math.min(width * 0.092, row.rowSpan * 0.42, 35.5);
          it.x = row.left + it.u * trackW;
          it.y = row.y;
          it.baseRadius = maxRowRadius * it.tplScale * densityFactor;
          it.toyWidth = it.baseRadius * 2;
        }
      }

      function updateHUD() {
        const lvlEl = document.getElementById('hud-level');
        const bngEl = document.getElementById('hud-bangles');
        const hitEl = document.getElementById('hud-hits');
        if (lvlEl) lvlEl.textContent = `${currentLevelIndex + 1} / 20`;
        if (bngEl) bngEl.textContent = `${banglesLeft}`;
        if (hitEl) hitEl.textContent = `${hitsThisLevel}`;
      }

      // ==========================================
      // 6. THROWING, 3D DEPTH PHYSICS & ±15% COLLISION
      // ==========================================
      function getPlayerHandPos() {
        return {
          x: width * 0.5,
          y: height * 0.88
        };
      }

      function launchBangle(targetX, targetY) {
        if (gameState !== 'PLAYING' || banglesLeft <= 0) return;

        // Cancel any pending round-end check if a throw occurs
        if (roundEndTimer !== null) {
          clearTimeout(roundEndTimer);
          roundEndTimer = null;
        }

        const clampedX = Math.max(width * 0.075, Math.min(width * 0.925, targetX));
        const clampedY = Math.max(height * 0.18, Math.min(height * 0.71, targetY));

        banglesLeft--;
        updateHUD();
        sound.playToss();

        // Subtle landing target ripple for crisp tactile feedback
        tapRipples.push({
          x: clampedX,
          y: clampedY,
          r: 6,
          maxR: 28,
          alpha: 0.75
        });

        const start = getPlayerHandPos();
        const dist = Math.hypot(clampedX - start.x, clampedY - start.y);
        const duration = Math.max(0.34, Math.min(0.54, dist / 760));

        activeBangles.push({
          startX: start.x,
          startY: start.y,
          targetX: clampedX,
          targetY: clampedY,
          x: start.x,
          y: start.y,
          groundY: start.y,
          arcLift: 0,
          elapsed: 0,
          duration: duration,
          arcHeight: 118 + (start.y - clampedY) * 0.18,
          scale: 1.18,
          tiltRatio: 0.62,
          rotation: 0
        });
      }

      function evaluateBangleLanding(bangle) {
        const cfg = LEVEL_CONFIGS[currentLevelIndex] || LEVEL_CONFIGS[0];
        // Smooth internal difficulty scaling from Level 1 (10%) to Level 20 (67%)
        const diffScale = 1 - (cfg.difficultyPct - 10) * 0.0045;

        let matchedItem = null;
        let bestRatio = Infinity;

        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          if (it.captured) continue;

          // Only items visibly inside the booth opening (not occluded behind the side pillars) can be collared
          const row = shelfRows[it.rowIndex];
          if (row && (it.x < row.innerLeft + 8 || it.x > row.innerRight - 8)) continue;

          const centerX = it.x;
          const centerY = it.y - it.baseRadius * 0.35;
          const dx = bangle.targetX - centerX;
          const dy = bangle.targetY - centerY;
          const dist = Math.hypot(dx, dy);

          // Exact ±15% target center rule scaled gently by internal level difficulty
          const threshold = Math.max(15, (it.toyWidth * 0.15 + 14) * diffScale);
          const ratio = dist / threshold;

          if (dist <= threshold && ratio < bestRatio) {
            bestRatio = ratio;
            matchedItem = it;
          }
        }

        if (matchedItem) {
          matchedItem.captured = true;
          matchedItem.captureAnim = 0.001;
          consecutiveHits++;

          const hitX = matchedItem.x;
          const hitY = matchedItem.y - matchedItem.baseRadius * 0.35;

          if (matchedItem.bonusValue > 0) {
            banglesLeft += matchedItem.bonusValue;
            hitsThisLevel++;
            totalHitsAllLevels++;
            sound.playHit(true, consecutiveHits);
            const burstColor = matchedItem.bonusValue >= 5 ? '#fde047' : '#52ffb8';
            spawnHitParticles(hitX, hitY, burstColor, matchedItem.bonusValue >= 5 ? 44 : 34);
            spawnFloatingText(hitX, hitY - 26, `套中！玉鐲 +${matchedItem.bonusValue}`, burstColor);
            pulseHudPill('pill-bangles');
            pulseHudPill('pill-hits');
          } else {
            hitsThisLevel++;
            totalHitsAllLevels++;
            sound.playHit(false, consecutiveHits);
            spawnHitParticles(hitX, hitY, '#ffd166', 30);
            const streakTag = consecutiveHits >= 2 ? `（連中 ×${consecutiveHits}）` : '';
            spawnFloatingText(hitX, hitY - 26, `套中 ${matchedItem.name}！${streakTag}`, '#ffe066');
            pulseHudPill('pill-hits');
          }

          updateHUD();
        } else {
          // MISS: reset streak, realistic jade shatter sound + micro camera shake + bouncing curved jade shards
          consecutiveHits = 0;
          sound.playShatter();
          triggerMicroShake(3.2, 0.14);
          spawnJadeShatter(bangle.targetX, bangle.targetY);
        }

        checkRoundEnd();
      }

      function checkRoundEnd() {
        if (gameState !== 'PLAYING') return;
        const allCaptured = items.every(it => it.captured);

        if ((banglesLeft <= 0 && activeBangles.length === 0) || allCaptured) {
          if (roundEndTimer !== null) clearTimeout(roundEndTimer);
          roundEndTimer = setTimeout(() => {
            roundEndTimer = null;
            if (gameState !== 'PLAYING') return;
            const stillAllCaptured = items.every(it => it.captured);
            if (activeBangles.length > 0 || (banglesLeft > 0 && !stillAllCaptured)) return;

            if (hitsThisLevel >= 1) {
              if (currentLevelIndex >= 19) {
                triggerVictoryScreen();
              } else {
                triggerLevelClearModal();
              }
            } else {
              triggerRetryModal();
            }
          }, 780);
        }
      }

      function spawnHitParticles(x, y, mainColor, count) {
        particles.push({
          kind: 'ring',
          x: x,
          y: y,
          r: 12,
          maxR: 84,
          alpha: 1,
          color: mainColor
        });

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
          const spd = 52 + Math.random() * 150;
          particles.push({
            kind: 'spark',
            x: x,
            y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 38,
            r: 2.5 + Math.random() * 3.5,
            alpha: 1,
            decay: 1.05 + Math.random() * 0.65,
            color: i % 2 === 0 ? mainColor : '#fffbeb'
          });
        }
      }

      function spawnJadeShatter(x, y) {
        // Brief bright impact flash & fracture ring
        particles.push({
          kind: 'ring',
          x: x,
          y: y,
          r: 8,
          maxR: 48,
          alpha: 0.8,
          color: '#a7f3d0'
        });

        // 11 curved broken emerald jade bangle segments + 10 fine jade splinters
        const pieceCount = 11;
        for (let i = 0; i < pieceCount; i++) {
          const angle = (Math.PI * 2 * i) / pieceCount + (Math.random() - 0.5) * 0.35;
          const speed = 55 + Math.random() * 130;
          const floorBounceY = y + 10 + Math.random() * 24;
          jadeShards.push({
            x: x + Math.cos(angle) * 14,
            y: y + Math.sin(angle) * 9,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 78,
            floorY: floorBounceY,
            bounced: false,
            rot: angle + Math.random() * 1.2,
            vRot: (Math.random() - 0.5) * 16,
            arcRadius: 14 + Math.random() * 8,
            arcSpan: 0.48 + Math.random() * 0.38,
            thick: 5.2 + Math.random() * 2.6,
            alpha: 1.0
          });
        }

        for (let j = 0; j < 10; j++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 120;
          particles.push({
            kind: 'spark',
            x: x,
            y: y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - 40,
            r: 1.8 + Math.random() * 2.0,
            alpha: 0.95,
            decay: 1.5 + Math.random() * 0.8,
            color: j % 2 === 0 ? '#6ee7b7' : '#ecfdf5'
          });
        }
      }

      function spawnFloatingText(x, y, text, color) {
        // Keep floating text safely inside horizontal canvas margins
        const safeX = Math.max(84, Math.min(width - 84, x));
        floatingTexts.push({
          x: safeX,
          y: y,
          text: text,
          color: color,
          alpha: 1.0,
          vy: -42
        });
      }

      function spawnFireworkBurst() {
        const fx = width * (0.15 + Math.random() * 0.7);
        const fy = height * (0.14 + Math.random() * 0.48);
        const palette = ['#ff4d6d', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#ff9f1c'];
        const color = palette[Math.floor(Math.random() * palette.length)];
        const count = 48;

        sound.playFirework();

        particles.push({
          kind: 'ring',
          x: fx,
          y: fy,
          r: 6,
          maxR: 92,
          alpha: 0.9,
          color: color
        });

        for (let i = 0; i < count; i++) {
          const a = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
          const spd = 45 + Math.random() * 175;
          fireworks.push({
            x: fx,
            y: fy,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            color: i % 5 === 0 ? '#fffbeb' : color,
            alpha: 1,
            decay: 0.62 + Math.random() * 0.45,
            r: 2.2 + Math.random() * 2.8
          });
        }
      }

      // ==========================================
      // 7. UI SCREEN TRANSITIONS

      // ==========================================
      // 8. SINGLE-POINTER TOUCH & MOUSE INPUT (Tap Target OR Drag/Flick Bangle)
      // ==========================================
      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (gameState !== 'PLAYING' || banglesLeft <= 0) return;
        if (activePointerId !== null) return;
        sound.init();
        if (!sound.bgmPlaying && !sound.muted) sound.startBGM();

        activePointerId = e.pointerId;
        const pt = getCanvasPoint(e.clientX, e.clientY);
        pointerStart = { x: pt.x, y: pt.y, time: performance.now() };
        pointerCurr = { x: pt.x, y: pt.y };
        isDraggingAim = pt.y > height * 0.72;
      });

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointerId || gameState !== 'PLAYING') return;
        pointerCurr = getCanvasPoint(e.clientX, e.clientY);
      });

      function finishPointer(e, cancelled) {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;

        if (cancelled || gameState !== 'PLAYING' || banglesLeft <= 0) {
          isDraggingAim = false;
          return;
        }

        const pt = getCanvasPoint(e.clientX, e.clientY);
        const dx = pt.x - pointerStart.x;
        const dy = pt.y - pointerStart.y;
        const dist = Math.hypot(dx, dy);

        if (isDraggingAim && dy < -22) {
          const hand = getPlayerHandPos();
          const targetX = hand.x + dx * 1.45;
          const targetY = hand.y + dy * 1.65;
          launchBangle(targetX, targetY);
        } else if (pt.y <= height * 0.75 && dist < 40) {
          launchBangle(pt.x, pt.y);
        } else if (dy < -25) {
          launchBangle(pt.x + dx * 0.6, pt.y + dy * 0.6);
        }
        isDraggingAim = false;
      }

      window.addEventListener('pointerup', (e) => finishPointer(e, false));
      window.addEventListener('pointercancel', (e) => finishPointer(e, true));

      // Pause/resume cleanly when switching iOS apps or browser tabs
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          sound.stopBGM();
          activePointerId = null;
          isDraggingAim = false;
        } else {
          lastTime = performance.now();
          if (gameState !== 'HOME' && !sound.muted) {
            sound.startBGM();
          }
        }
      });

      // ==========================================
      // 9. HIGH-CRAFT TAIWAN NIGHT MARKET SCENE RENDERING
      // ==========================================
      function drawNightMarketBackdrop() {
        // 1. Deep Night Market Sky & Distant Street Bokeh
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, '#0d0402');
        skyGrad.addColorStop(0.35, '#260e07');
        skyGrad.addColorStop(0.72, '#381509');
        skyGrad.addColorStop(1, '#120602');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        for (let i = 0; i < distantBokeh.length; i++) {
          const bk = distantBokeh[i];
          const pulse = 0.86 + 0.14 * Math.sin(globalTime * 1.6 + bk.phase);
          const bGrad = ctx.createRadialGradient(bk.x, bk.y, 1, bk.x, bk.y, bk.r * pulse);
          bGrad.addColorStop(0, bk.color);
          bGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.arc(bk.x, bk.y, bk.r * pulse, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Warm ambient golden-orange glow radiating from the booth interior
        const glowGrad = ctx.createRadialGradient(width * 0.5, height * 0.42, 30, width * 0.5, height * 0.42, width * 0.85);
        glowGrad.addColorStop(0, 'rgba(255, 178, 72, 0.36)');
        glowGrad.addColorStop(0.55, 'rgba(215, 80, 20, 0.14)');
        glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, width, height);

        drawBuntingFlags();
        drawSideBalloonsAndPaperLanterns();
        drawWoodenStallBackAndShelves();
      }

      function drawBuntingFlags() {
        ctx.save();
        const colors = ['#e63946', '#ffb703', '#06d6a0', '#219ebc', '#fb8500'];
        const strings = [
          { x1: 0, y1: height * 0.055, x2: width * 0.35, y2: height * 0.145 },
          { x1: width, y1: height * 0.055, x2: width * 0.65, y2: height * 0.145 }
        ];
        strings.forEach((st, sIdx) => {
          ctx.strokeStyle = 'rgba(255, 225, 170, 0.6)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(st.x1, st.y1);
          ctx.quadraticCurveTo((st.x1 + st.x2) * 0.5, (st.y1 + st.y2) * 0.5 + 18, st.x2, st.y2);
          ctx.stroke();

          const steps = 6;
          for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const px = (1 - t) * (1 - t) * st.x1 + 2 * (1 - t) * t * ((st.x1 + st.x2) * 0.5) + t * t * st.x2;
            const py = (1 - t) * (1 - t) * st.y1 + 2 * (1 - t) * t * ((st.y1 + st.y2) * 0.5 + 18) + t * t * st.y2;
            const sway = Math.sin(globalTime * 2.2 + i + sIdx) * 2.8;

            ctx.fillStyle = colors[(i + sIdx * 2) % colors.length];
            ctx.beginPath();
            ctx.moveTo(px - 8, py);
            ctx.lineTo(px + 8, py);
            ctx.lineTo(px + sway, py + 17);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        });
        ctx.restore();
      }

      function drawSideBalloonsAndPaperLanterns() {
        ctx.save();
        const sidePositions = [
          { x: width * 0.038, y: height * 0.31, color: '#ff6b35' },
          { x: width * 0.038, y: height * 0.47, color: '#ffb703' },
          { x: width * 0.962, y: height * 0.31, color: '#ffb703' },
          { x: width * 0.962, y: height * 0.47, color: '#ff6b35' }
        ];

        sidePositions.forEach((p, idx) => {
          const swing = Math.sin(globalTime * 1.8 + idx * 1.3) * 2.6;
          const lx = p.x + swing;
          const ly = p.y;

          ctx.strokeStyle = '#d9a05b';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(p.x, ly - 26);
          ctx.lineTo(lx, ly - 13);
          ctx.stroke();

          const glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 28);
          glow.addColorStop(0, 'rgba(255, 215, 130, 0.5)');
          glow.addColorStop(1, 'rgba(255, 140, 40, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(lx, ly, 28, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(lx, ly, 11, 14, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(110, 25, 5, 0.4)';
          ctx.lineWidth = 0.9;
          for (let py = -8; py <= 8; py += 4) {
            ctx.beginPath();
            ctx.moveTo(lx - 10, ly + py);
            ctx.lineTo(lx + 10, ly + py);
            ctx.stroke();
          }

          ctx.fillStyle = '#361607';
          ctx.fillRect(lx - 5.5, ly - 15, 11, 3);
          ctx.fillRect(lx - 5.5, ly + 12, 11, 3);
        });

        const balloonClusters = [
          { baseX: width * 0.06, baseY: height * 0.65, offsets: [{ dx: -6, dy: -30, c: '#ef476f' }, { dx: 7, dy: -39, c: '#3a86ff' }, { dx: -1, dy: -49, c: '#ffbe0b' }] },
          { baseX: width * 0.94, baseY: height * 0.65, offsets: [{ dx: 6, dy: -30, c: '#06d6a0' }, { dx: -7, dy: -39, c: '#ef476f' }, { dx: 1, dy: -49, c: '#ffbe0b' }] }
        ];

        balloonClusters.forEach((cl, cIdx) => {
          cl.offsets.forEach((b, bIdx) => {
            const bob = Math.sin(globalTime * 2.3 + cIdx + bIdx) * 2.5;
            const bx = cl.baseX + b.dx + bob * 0.5;
            const by = cl.baseY + b.dy + bob;

            ctx.strokeStyle = 'rgba(255, 240, 210, 0.55)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(cl.baseX, cl.baseY);
            ctx.lineTo(bx, by + 11);
            ctx.stroke();

            const bGrad = ctx.createRadialGradient(bx - 3, by - 4, 1, bx, by, 12);
            bGrad.addColorStop(0, '#ffffff');
            bGrad.addColorStop(0.25, b.c);
            bGrad.addColorStop(1, '#1a0604');
            ctx.fillStyle = bGrad;
            ctx.beginPath();
            ctx.ellipse(bx, by, 9.5, 11.5, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        });

        ctx.restore();
      }

      function drawWoodenStallBackAndShelves() {

      // Drawn OVER the strictly clipped toys: soft interior occlusion shadows + solid rosewood pillars + pleated red side drapes!
      function drawWoodenStallFrontPillarsAndTop() {
        const { stallLeft, stallRight, pillarW, innerLeft, innerRight } = getBoothInnerBounds();
        const stallTop = height * 0.155;
        const stallBot = height * 0.725;
        const stallH = stallBot - stallTop;

        ctx.save();

        // 1. Soft interior recess shadows along left & right inner edges (gives real 3D depth as toys slide behind the pillars)
        const shadowW = 22;
        const leftShadow = ctx.createLinearGradient(innerLeft, 0, innerLeft + shadowW, 0);
        leftShadow.addColorStop(0, 'rgba(8, 2, 0, 0.78)');
        leftShadow.addColorStop(0.45, 'rgba(8, 2, 0, 0.30)');
        leftShadow.addColorStop(1, 'rgba(8, 2, 0, 0)');
        ctx.fillStyle = leftShadow;
        ctx.fillRect(innerLeft, stallTop, shadowW, stallH);

        const rightShadow = ctx.createLinearGradient(innerRight, 0, innerRight - shadowW, 0);
        rightShadow.addColorStop(0, 'rgba(8, 2, 0, 0.78)');
        rightShadow.addColorStop(0.45, 'rgba(8, 2, 0, 0.30)');
        rightShadow.addColorStop(1, 'rgba(8, 2, 0, 0)');
        ctx.fillStyle = rightShadow;
        ctx.fillRect(innerRight - shadowW, stallTop, shadowW, stallH);

        // 2. Solid Rosewood Side Pillars (completely opaque wooden frame occluding the track entrance/exit)
        [stallLeft - 2, stallRight - pillarW + 2].forEach((px, idx) => {
          const pGrad = ctx.createLinearGradient(px, 0, px + pillarW, 0);
          pGrad.addColorStop(0, '#180802');
          pGrad.addColorStop(0.32, '#753619');
          pGrad.addColorStop(0.68, '#4f220e');
          pGrad.addColorStop(1, '#160702');
          ctx.fillStyle = pGrad;
          ctx.fillRect(px, stallTop, pillarW, stallH + 18);

          // Inner bevel edge highlight
          ctx.strokeStyle = 'rgba(255, 205, 125, 0.25)';
          ctx.lineWidth = 1;
          const innerEdgeX = idx === 0 ? px + pillarW - 0.5 : px + 0.5;
          ctx.beginPath();
          ctx.moveTo(innerEdgeX, stallTop);
          ctx.lineTo(innerEdgeX, stallBot + 16);
          ctx.stroke();

          // Brass mounting brackets
          ctx.fillStyle = '#e0a546';
          ctx.fillRect(px + 1.5, stallTop + 28, pillarW - 3, 4.5);
          ctx.fillRect(px + 1.5, stallTop + stallH * 0.5, pillarW - 3, 4.5);
          ctx.fillRect(px + 1.5, stallBot - 22, pillarW - 3, 4.5);
        });

        // 3. Pleated Red Night Market Side Curtains tied neatly along the outer pillars
        const drapeH = stallH * 0.88;
        // Left drape
        const lDrapeGrad = ctx.createLinearGradient(stallLeft - 6, 0, innerLeft + 6, 0);
        lDrapeGrad.addColorStop(0, '#780c09');
        lDrapeGrad.addColorStop(0.5, '#b81d18');
        lDrapeGrad.addColorStop(1, '#630806');
        ctx.fillStyle = lDrapeGrad;
        ctx.beginPath();
        ctx.moveTo(stallLeft - 5, stallTop + 2);
        ctx.lineTo(innerLeft + 5, stallTop + 2);
        ctx.quadraticCurveTo(innerLeft + 1, stallTop + drapeH * 0.45, stallLeft + 3, stallTop + drapeH * 0.62);
        ctx.quadraticCurveTo(innerLeft - 1, stallTop + drapeH * 0.82, stallLeft + 5, stallTop + drapeH);
        ctx.lineTo(stallLeft - 5, stallTop + drapeH);
        ctx.closePath();
        ctx.fill();

        // Right drape
        const rDrapeGrad = ctx.createLinearGradient(innerRight - 6, 0, stallRight + 6, 0);
        rDrapeGrad.addColorStop(0, '#630806');
        rDrapeGrad.addColorStop(0.5, '#b81d18');
        rDrapeGrad.addColorStop(1, '#780c09');
        ctx.fillStyle = rDrapeGrad;
        ctx.beginPath();
        ctx.moveTo(stallRight + 5, stallTop + 2);
        ctx.lineTo(innerRight - 5, stallTop + 2);
        ctx.quadraticCurveTo(innerRight - 1, stallTop + drapeH * 0.45, stallRight - 3, stallTop + drapeH * 0.62);
        ctx.quadraticCurveTo(innerRight + 1, stallTop + drapeH * 0.82, stallRight - 5, stallTop + drapeH);
        ctx.lineTo(stallRight + 5, stallTop + drapeH);
        ctx.closePath();
        ctx.fill();

        // Gold tie-back cords on both side curtains
        ctx.strokeStyle = '#fad05a';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(stallLeft - 4, stallTop + drapeH * 0.60);
        ctx.lineTo(stallLeft + 5, stallTop + drapeH * 0.63);
        ctx.moveTo(stallRight + 4, stallTop + drapeH * 0.60);
        ctx.lineTo(stallRight - 5, stallTop + drapeH * 0.63);
        ctx.stroke();

        ctx.restore();

        drawTopCurtainAndSignboard();
        drawBulbsAndRedLanterns();
      }

        ctx.fillStyle = '#b81d13';
        [
          [signX + 9, signY + 9],

      function drawBulbsAndRedLanterns() {
        const awningY = height * 0.145;
        const stallLeft = width * 0.085;
        const stallRight = width * 0.915;

        ctx.save();

        const bulbCount = 7;
        for (let i = 0; i < bulbCount; i++) {
          const bx = stallLeft + ((stallRight - stallLeft) * i) / (bulbCount - 1);
          const by = awningY + 4;
          const flicker = 0.88 + 0.12 * Math.sin(globalTime * 6.5 + i * 2.1) * Math.cos(globalTime * 11 + i);

          if (i % 2 === 0) {
            const coneGrad = ctx.createLinearGradient(bx, by, bx, by + height * 0.36);
            coneGrad.addColorStop(0, `rgba(255, 224, 135, ${0.12 * flicker})`);
            coneGrad.addColorStop(1, 'rgba(255, 180, 70, 0)');
            ctx.fillStyle = coneGrad;
            ctx.beginPath();
            ctx.moveTo(bx - 6, by);
            ctx.lineTo(bx + 6, by);
            ctx.lineTo(bx + 58, by + height * 0.36);
            ctx.lineTo(bx - 58, by + height * 0.36);
            ctx.closePath();
            ctx.fill();
          }

          const halo = ctx.createRadialGradient(bx, by, 1, bx, by, 26 * flicker);
          halo.addColorStop(0, `rgba(255, 248, 200, ${0.9 * flicker})`);
          halo.addColorStop(0.45, `rgba(255, 190, 70, ${0.46 * flicker})`);
          halo.addColorStop(1, 'rgba(255, 140, 20, 0)');
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(bx, by, 26 * flicker, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#b07d32';
          ctx.beginPath();
          ctx.moveTo(bx - 7, by - 2);
          ctx.lineTo(bx + 7, by - 2);
          ctx.lineTo(bx + 3, by - 6);
          ctx.lineTo(bx - 3, by - 6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fffbe0';
          ctx.beginPath();
          ctx.arc(bx, by + 1, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }

        const lanternCoords = [
          { x: width * 0.135, y: height * 0.18 },
          { x: width * 0.865, y: height * 0.18 }
        ];

        lanternCoords.forEach((ln, idx) => {
          const sway = Math.sin(globalTime * 1.8 + idx * 2.4) * 2.8;
          const lx = ln.x + sway;
          const ly = ln.y;
          const flicker = 0.90 + 0.10 * Math.sin(globalTime * 5.8 + idx * 3);

          const lGlow = ctx.createRadialGradient(lx, ly, 4, lx, ly, 50 * flicker);
          lGlow.addColorStop(0, `rgba(255, 200, 95, ${0.58 * flicker})`);
          lGlow.addColorStop(0.5, `rgba(235, 55, 25, ${0.30 * flicker})`);
          lGlow.addColorStop(1, 'rgba(200, 20, 10, 0)');
          ctx.fillStyle = lGlow;
          ctx.beginPath();
          ctx.arc(lx, ly, 50 * flicker, 0, Math.PI * 2);
          ctx.fill();

          const bodyGrad = ctx.createRadialGradient(lx - 5, ly - 5, 3, lx, ly, 23);
          bodyGrad.addColorStop(0, '#ff6242');
          bodyGrad.addColorStop(0.6, '#d91e14');
          bodyGrad.addColorStop(1, '#7d0904');
          ctx.fillStyle = bodyGrad;
          ctx.beginPath();
          ctx.ellipse(lx, ly, 22, 18, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 210, 105, 0.5)';
          ctx.lineWidth = 1.1;
          [-10, 0, 10].forEach((rx) => {
            ctx.beginPath();
            ctx.ellipse(lx, ly, Math.max(2.5, Math.abs(rx)), 17.5, 0, 0, Math.PI * 2);
            ctx.stroke();
          });

          ctx.fillStyle = 'rgba(255, 225, 130, 0.85)';
          ctx.font = 'bold 11px "Noto Serif TC", serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('吉', lx, ly + 0.5);

          ctx.fillStyle = '#f2b949';
          ctx.fillRect(lx - 8, ly - 19.5, 16, 4);
          ctx.fillRect(lx - 8, ly + 15.5, 16, 4);

          ctx.strokeStyle = '#f5c242';
          ctx.lineWidth = 1.6;
          [-2.5, 0, 2.5].forEach((tx) => {
            ctx.beginPath();
            ctx.moveTo(lx + tx, ly + 19.5);
            ctx.lineTo(lx + tx + sway * 0.45, ly + 33);
            ctx.stroke();
          });
        });

        ctx.restore();
      }

      // ==========================================
      // 10. RENDERING ENLARGED, HIGH-DETAIL TOYS & COLLAR-DROP CELEBRATION
      // ==========================================
      function drawToyItem(item) {
        if (item.captured && item.captureAnim >= 1) return;

        ctx.save();
        const bob = Math.sin(globalTime * 3.0 + item.bobPhase) * 2.0;

        // 2-stage celebratory physics on capture:
        // Stage 1 (0..0.42): Jade bangle drops snugly onto toy + toy does a joyful squash-and-stretch hop
        // Stage 2 (0.42..1.0): Collared toy ascends smoothly with golden sparkle fade
        let scaleX = 1;
        let scaleY = 1;
        let liftY = 0;
        let alpha = 1;
        let collarDropOffsetY = 0;

        if (item.captured) {
          const p = item.captureAnim;
          if (p < 0.42) {
            const k = p / 0.42;
            const bounce = Math.sin(k * Math.PI);
            scaleX = 1 + bounce * 0.14;
            scaleY = 1 - bounce * 0.10 + (k > 0.5 ? (k - 0.5) * 0.28 : 0);
            liftY = -bounce * 9;
            collarDropOffsetY = -(1 - Math.min(1, k * 2.2)) * 24;
          } else {
            const k = (p - 0.42) / 0.58;
            scaleX = 1.08 + k * 0.24;
            scaleY = 1.08 + k * 0.24;
            liftY = -9 - k * 28;
            alpha = Math.max(0, 1 - k * 1.15);
          }
        }

        // Smooth physical occlusion fade as an item enters the dark recess behind the rosewood pillars
        const row = shelfRows[item.rowIndex];
        let edgeFade = 1;
        if (row) {
          const distFromLeft = item.x - row.innerLeft;
          const distFromRight = row.innerRight - item.x;
          const minEdgeDist = Math.min(distFromLeft, distFromRight);
          if (minEdgeDist < 18) {
            edgeFade = Math.max(0, Math.min(1, (minEdgeDist + 14) / 32));
          }
        }
        if (edgeFade <= 0.01) {
          ctx.restore();
          return;
        }

        ctx.translate(item.x, item.y + bob + liftY);
        ctx.scale(scaleX, scaleY);
        ctx.globalAlpha = alpha * edgeFade;

        const r = item.baseRadius;

        // Contact drop shadow on shelf
        ctx.fillStyle = 'rgba(10, 2, 0, 0.65)';
        ctx.beginPath();
        ctx.ellipse(0, 4 - liftY * 0.5, r * 0.78, r * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wooden prize block stand
        const baseGrad = ctx.createLinearGradient(-r * 0.58, 0, r * 0.58, 0);
        baseGrad.addColorStop(0, '#784421');
        baseGrad.addColorStop(0.5, '#e0ac69');
        baseGrad.addColorStop(1, '#5e3214');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.roundRect(-r * 0.54, -4, r * 1.08, 7, 3);
        ctx.fill();
        ctx.strokeStyle = 'rgba(40, 15, 5, 0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Glow aura
        if (item.glow) {
          const pulse = 0.86 + 0.14 * Math.sin(globalTime * 4.8 + item.bobPhase);
          const gColor = item.bonusValue >= 5
            ? 'rgba(253, 224, 71, 0.52)'
            : (item.bonusValue > 0 ? 'rgba(72, 255, 175, 0.46)' : 'rgba(255, 220, 100, 0.40)');
          const auraRad = item.bonusValue > 0 ? r * 1.10 * pulse : r * 1.24 * pulse;
          const aura = ctx.createRadialGradient(0, -r * 0.45, 3, 0, -r * 0.45, auraRad);
          aura.addColorStop(0, gColor);
          aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(0, -r * 0.45, auraRad, 0, Math.PI * 2);
          ctx.fill();
        }

        switch (item.type) {
          case 'bonus_token':    drawBonusProp(r, item.bonusValue); break;
          case 'teddy_giant':    drawTeddyBear(r); break;
          case 'panda_plush':    drawPandaPlush(r); break;
          case 'mecha_figure':   drawMechaFigure(r); break;
          case 'glow_star_orb':  drawGlowStarToy(r); break;
          case 'retro_car':      drawRetroCar(r); break;
          case 'bunny_doll':     drawBunnyDoll(r); break;
          case 'shiba_plush':    drawShibaPlush(r); break;
          case 'daruma_doll':    drawDarumaDoll(r); break;
          case 'candy_box':      drawCandyBox(r); break;
          case 'keychain_charm': drawKeychainCharm(r); break;
          case 'mini_duck':      drawMiniDuck(r); break;
          default:               drawCapsuleToy(r); break;
        }

        // Physical jade bangle collar settling around the captured prize!
        if (item.captured) {
          drawJadeBangleRing(0, -r * 0.16 + collarDropOffsetY, r * 0.88, r * 0.44, 0);
        }

        ctx.restore();
      }

      function drawBonusProp(r, val) {
        ctx.save();
        ctx.translate(0, -r * 0.50);

        const isPlusFive = val >= 5;
        const plaqueGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 2, 0, 0, r * 0.68);
        if (isPlusFive) {
          plaqueGrad.addColorStop(0, '#fef08a');
          plaqueGrad.addColorStop(0.55, '#f59e0b');
          plaqueGrad.addColorStop(1, '#b45309');
        } else {
          plaqueGrad.addColorStop(0, '#34d399');
          plaqueGrad.addColorStop(0.65, '#059669');
          plaqueGrad.addColorStop(1, '#064e3b');
        }

        ctx.fillStyle = plaqueGrad;
        ctx.strokeStyle = isPlusFive ? '#fffbeb' : '#fde047';
        ctx.lineWidth = isPlusFive ? 4.0 : 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.66, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = isPlusFive ? '#fef08a' : '#a7f3d0';
